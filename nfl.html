<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prop.AI NFL Board</title>
<style>

:root{
  --bg:#070d0b; --surface:#0f1613; --surface-2:#141d19; --surface-3:#1b2621;
  --border:#26332c; --border-soft:#1a2621;
  --fg:#e9f1ec; --mut:#8d9d94; --faint:#5d6c64;
  --acc:#23dd79; --acc-soft:rgba(35,221,121,.13); --acc-text:#5cf0a0;
  --up:#23dd79; --up-soft:rgba(35,221,121,.13);
  --down:#ff6b5e; --down-soft:rgba(255,107,94,.13);
  --stay:#7d8b95; --stay-soft:rgba(125,139,149,.13);
  --agree-soft:rgba(35,221,121,.09); --agree-border:rgba(35,221,121,.34);
  --held:#1e2415; --q:#2a1614;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f6f3; --surface:#ffffff; --surface-2:#eaf1ec; --surface-3:#dfe9e3;
  --border:#c9d8ce; --border-soft:#dfe9e3;
  --fg:#0b1a13; --mut:#4f6358; --faint:#7e9287;
  --acc:#0f9c55; --acc-soft:rgba(15,156,85,.10); --acc-text:#0b7a42;
  --up:#0f9c55; --up-soft:rgba(15,156,85,.10);
  --down:#c8443a; --down-soft:rgba(200,68,58,.10);
  --stay:#63727c; --stay-soft:rgba(99,114,124,.10);
  --agree-soft:rgba(15,156,85,.07); --agree-border:rgba(15,156,85,.30);
  --held:#fbf4dc; --q:#fbeae8;
  color-scheme:light;
}
/* The wordmark is white-on-dark art, so on a forced light theme it needs its own dark plate
   rather than disappearing into the page. */
.brand-logo{display:block;height:auto;max-width:100%}
:root[data-theme="light"] .brand-logo{background:var(--brand-ink,#070d0b);border-radius:6px;padding:3px 6px}
.brand-banner{display:block;width:100%;height:auto}
.brand-hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--border-soft);
  background:#070d0b;line-height:0;margin-bottom:16px}
.brand-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;pointer-events:none;
  background:linear-gradient(to bottom,rgba(7,13,11,0),var(--bg))}
.brand-bar{display:flex;align-items:center;gap:11px;min-width:0}
.brand-rule{height:2px;border:0;margin:0;background:linear-gradient(90deg,var(--acc),transparent)}
@media (max-width:700px){.brand-hero{border-radius:10px}}

.pa-nav{position:sticky;top:0;z-index:40;background:rgba(7,13,11,.93);
  -webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--border-soft)}
:root[data-theme="light"] .pa-nav{background:rgba(255,255,255,.92)}
.pa-nav-in{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px;
  min-height:58px}
.pa-brand{display:flex;align-items:center;flex:0 0 auto;text-decoration:none}
.pa-links{display:flex;align-items:center;gap:2px;margin:0 auto;min-width:0;overflow-x:auto;
  scrollbar-width:none}
.pa-links::-webkit-scrollbar{display:none}
/* One rule for the <button>s the hub uses and the <a>s the board uses, so the two cannot drift. */
.pa-links .tab,.pa-links a.tab{appearance:none;border:0;background:transparent;color:var(--mut);
  font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:19px 14px 17px;cursor:pointer;text-decoration:none;white-space:nowrap;position:relative;
  border-radius:0;transition:color .12s}
.pa-links .tab:hover{color:var(--fg)}
.pa-links .tab.on{color:var(--acc);background:transparent}
.pa-links .tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;
  border-radius:2px 2px 0 0;background:var(--acc)}
.pa-links .tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;
  background:var(--stay);vertical-align:middle}
.pa-links .tab.live .dot{background:var(--up);box-shadow:0 0 0 2px rgba(35,221,121,.18)}
.pa-cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);
  border:1.5px solid var(--acc);border-radius:999px;padding:8px 18px;white-space:nowrap;
  transition:background .12s,color .12s}
.pa-cta:hover{background:var(--acc);color:#04120b}
.pa-cta svg{width:12px;height:12px}
/* The hero is the banner art cropped to a band. The board gets a short one because its table is
   the product and a 471px hero would push it under the fold; the hub gets the full image.

   The crop is anchored near the TOP of the art, not its middle. The art is 1600x471 with the
   Prop.AI wordmark at y 47..248 and its swoosh to ~258; `cover` scales it to the page width, so a
   132px band centred at 50% showed y 170..302 -- the wordmark sliced through the middle, which is
   what Josh reported on 2026-09-23 ("cropped too high ... needs to be centered lower to better see
   the full logo"). 214px at 18% shows y 46..260: the whole wordmark AND the swoosh, whose tail
   sweeps down under the "P" to y 258 -- a 180px band cut that tail off, which is why the height
   went up rather than only the offset moving. The percentage (not a pixel offset) is what keeps it
   right at every width, because the overflow scales with the viewport. */
.pa-hero{position:relative;overflow:hidden;background:#070d0b;line-height:0}
.pa-hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:left center}
.pa-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;pointer-events:none;
  background:linear-gradient(to bottom,rgba(7,13,11,0),var(--bg))}
.pa-hero.band{height:214px}
.pa-hero.band img{object-position:right 18%}
/* The fade exists to blend the art into the page, but on the band it sits exactly where the swoosh
   does: at 34% it covered the bottom 73px while the swoosh occupies the bottom ~90px, washing out
   the logo's own green underline. Keep the blend, shrink it to the last sliver -- 8% of 214px is
   17px, and a gradient is transparent at its top edge, so it only softens the final few pixels. */
.pa-hero.band::after{height:8%}
@media (max-width:900px){
  .pa-nav-in{gap:10px;padding:0 14px}
  .pa-links .tab{padding:17px 9px;font-size:.72rem;letter-spacing:.06em}
  .pa-cta{padding:7px 12px;font-size:.68rem}
  /* narrower viewport: the art renders shorter, so the band needs proportionally less height to
     hold the same slice -- 120px at 900w shows ~212 source px, still the whole wordmark+swoosh. */
  .pa-hero.band{height:120px}
}
@media (max-width:640px){.pa-cta span{display:none}.pa-cta{padding:8px 11px}}
/* the view switch, upper right on every page */
.pa-view{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;appearance:none;cursor:pointer;
  font:inherit;font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);background:transparent;border:1.5px solid var(--border);border-radius:999px;
  padding:7px 13px;white-space:nowrap;transition:color .12s,border-color .12s,background .12s}
.pa-view:hover{color:var(--fg);border-color:var(--acc)}
.pa-view[aria-pressed="true"]{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
.pa-view svg{width:13px;height:13px;flex:0 0 auto}
@media (max-width:900px){.pa-view{padding:6px 10px;font-size:.66rem}.pa-view span{display:none}}

body[data-view="mobile"]{font-size:15px;-webkit-text-size-adjust:100%;overflow-x:hidden}
body[data-view="mobile"] .wrap,body[data-view="mobile"] .shell{max-width:640px;margin:0 auto;
  padding-left:14px;padding-right:14px}
body[data-view="mobile"] .shell{display:block;gap:0}
body[data-view="mobile"] .pa-nav-in{padding:0 12px;gap:8px;min-height:52px}
body[data-view="mobile"] .pa-hero.band{height:96px}
body[data-view="mobile"] .card{border-radius:12px}
body[data-view="mobile"] .card>.body,body[data-view="mobile"] details>.body{padding:11px 12px}
/* rails: the games strip swipes across the top, the data tiles sit at the bottom two-up */
body[data-view="mobile"] .rail{position:static;max-height:none;overflow:visible;display:block}
body[data-view="mobile"] .rail-left{display:flex;flex-wrap:wrap;gap:8px;padding:0}
body[data-view="mobile"] .rail-left .rail-h,body[data-view="mobile"] .rail-left .allgames{flex:1 1 100%}
body[data-view="mobile"] .rail-left .gcard{flex:0 0 78%;scroll-snap-align:start}
body[data-view="mobile"] .rail-left .grx{flex:0 0 92%;scroll-snap-align:start}
body[data-view="mobile"] .rail-left>div:not(.rail-h):not(.dcard){display:flex;gap:8px;width:100%;
  overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}
body[data-view="mobile"] .rail-left>div::-webkit-scrollbar{display:none}
/* minmax(0,…) not 1fr: a plain 1fr cannot shrink below its content's min-width, so a rail holding a
   list rather than tiles (the DFS player pool) pushed itself off the screen. */
body[data-view="mobile"] .rail-right{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;margin-top:12px;align-content:start}
body[data-view="mobile"] .rail-right .dcard{margin:0!important}
body[data-view="mobile"] .rail-right .dcard .v{font-size:.92rem}
/* tabs and chips: one swipeable row, thumb-sized */
body[data-view="mobile"] .book-tabs,body[data-view="mobile"] .anchor-tabs,body[data-view="mobile"] .subtabs,
body[data-view="mobile"] .postabs,body[data-view="mobile"] .chips,body[data-view="mobile"] .seg{
  display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
body[data-view="mobile"] .book-tabs::-webkit-scrollbar,body[data-view="mobile"] .anchor-tabs::-webkit-scrollbar,
body[data-view="mobile"] .subtabs::-webkit-scrollbar,body[data-view="mobile"] .postabs::-webkit-scrollbar,
body[data-view="mobile"] .chips::-webkit-scrollbar,body[data-view="mobile"] .seg::-webkit-scrollbar{display:none}
body[data-view="mobile"] .book-tab,body[data-view="mobile"] .anchor-tab,body[data-view="mobile"] .subtab,
body[data-view="mobile"] .ptab,body[data-view="mobile"] .chip{flex:0 0 auto;scroll-snap-align:start;
  min-height:38px;padding:9px 13px;font-size:.78rem}
/* Filters: one tap to open, search always out. A board carries up to five filter rows, and two of
   them sticky at the same offset overlapped the first card -- on a phone they are a sheet, not a bar. */
body[data-view="mobile"] .filterbar{position:static;display:flex;flex-wrap:wrap;gap:8px;
  padding:0;margin:0 0 8px;border:0}
.pa-filtbtn{display:none}
body[data-view="mobile"] .pa-filtbtn{display:flex;align-items:center;justify-content:space-between;
  width:100%;gap:8px;min-height:44px;margin:0 0 9px;padding:10px 13px;cursor:pointer;
  font:inherit;font-size:.8rem;font-weight:700;color:var(--fg);background:var(--surface);
  border:1px solid var(--border-soft);border-radius:11px}
body[data-view="mobile"] .pa-filtbtn .pa-caret{color:var(--faint);font-size:.9rem}
body[data-view="mobile"] .pa-filters{background:var(--surface);border:1px solid var(--border-soft);
  border-radius:11px;padding:11px 12px;margin:0 0 10px}
body:not([data-view="mobile"]) .pa-filters{display:block!important;background:none;border:0;padding:0;margin:0}
body[data-view="mobile"] .pa-searchtop{margin:0 0 9px}
body[data-view="mobile"] .pa-searchtop .search{width:100%}
body[data-view="mobile"] .filterbar>*{flex:1 1 46%;min-width:0}
body[data-view="mobile"] .filterbar .search,body[data-view="mobile"] .search{flex:1 1 100%}
body[data-view="mobile"] input,body[data-view="mobile"] select,body[data-view="mobile"] textarea{font-size:16px}
body[data-view="mobile"] select,body[data-view="mobile"] input[type=text],body[data-view="mobile"] input[type=search]{
  min-height:40px;width:100%}
body[data-view="mobile"] button,body[data-view="mobile"] .pd-btn,body[data-view="mobile"] label.f{min-height:40px}
/* THE TABLES: every row is a card, every cell carries its column header as its label */
body[data-view="mobile"] .tablescroll{overflow:visible!important;max-height:none!important}
body[data-view="mobile"] table{min-width:0!important;width:100%;display:block;border-collapse:separate}
body[data-view="mobile"] thead{display:none}
body[data-view="mobile"] tbody{display:block}
body[data-view="mobile"] tbody tr.row{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
  padding:11px 13px;margin:0 0 9px;cursor:pointer}
body[data-view="mobile"] tbody tr.row.open{border-color:var(--acc);background:var(--acc-soft)}
body[data-view="mobile"] tbody tr.row>td{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;border:0!important;padding:3px 0;font-size:.84rem;white-space:normal;max-width:none;
  min-width:0;overflow:hidden;overflow-wrap:anywhere}
body[data-view="mobile"] tbody tr.row>td::before{content:attr(data-label);color:var(--faint);
  font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto;
  margin-right:auto;padding-right:8px}
body[data-view="mobile"] tbody tr.row>td[data-title]{grid-column:1/-1;font-size:1rem;font-weight:700;
  padding-bottom:6px;margin-bottom:3px;border-bottom:1px solid var(--border-soft)!important;display:block}
body[data-view="mobile"] tbody tr.row>td[data-title]::before{display:none}
body[data-view="mobile"] tbody tr.row>td[data-rank]{display:none}
/* a long value cannot share a 165px column with the next label -- it takes the whole row */
body[data-view="mobile"] tbody tr.row>td[data-wide]{grid-column:1/-1}
body[data-view="mobile"] tbody tr.row>td:empty,
body[data-view="mobile"] tbody tr.row>td[data-na]{display:none}
body[data-view="mobile"] tbody tr.row>td.chev{display:none}
/* the expansion: full width, one column, and none of the desktop width arithmetic */
body[data-view="mobile"] tr.detail{display:none}
body[data-view="mobile"] tr.detail.open,body[data-view="mobile"] tr.detail[open]{display:block;margin:-4px 0 12px}
body[data-view="mobile"] tr.detail>td{position:static!important;left:auto!important;
  width:auto!important;max-width:none!important;display:block;padding:0;border:0}
body[data-view="mobile"] .detail,body[data-view="mobile"] .es-detail-in,body[data-view="mobile"] .cs2d{
  grid-template-columns:1fr!important;gap:10px}
body[data-view="mobile"] .ladder .brow{font-size:.72rem}
body[data-view="mobile"] .dtable{width:100%}
body[data-view="mobile"] table table{display:table}
body[data-view="mobile"] table table tr{display:table-row}
body[data-view="mobile"] table table td{display:table-cell}
body[data-view="mobile"] table table td::before{display:none}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-bottom:56px}
.num{font-family:ui-monospace,"SF Mono",Consolas,Menlo,monospace;font-variant-numeric:tabular-nums}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em}
/* The nav bar (viz/brand.nav_html) replaced this page's own back link: the wordmark and
   the call to action both go home, so there is no bespoke button here any more. */
.meta{color:var(--mut);font-size:.76rem;margin-top:4px}
.wrap{padding:14px 16px 8px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.stale{background:var(--held);border:1px solid var(--acc);padding:7px 10px;border-radius:6px;font-size:.8rem}
.stale[hidden]{display:none}

/* ── three-column shell: games rail | board | data rail ──────────────────────
   The board is the product; the slate and the capture stats are context that used to sit ABOVE
   it as two dense sentences, pushing the table below the fold. Rails put both within reach
   without either one costing the table its position. */
.shell{max-width:1800px;margin:0 auto;padding:6px 16px 8px;display:grid;gap:14px;
  grid-template-columns:272px minmax(0,1fr) 224px;align-items:start}
/* A game's expansion lives in the rail, under the card that was clicked, so the rail takes the
   width it needs while one is open and gives it back when it closes (Josh, 2026-09-26). */
.shell[data-exp="1"]{grid-template-columns:430px minmax(0,1fr) 224px}
.shell.shell-dfs[data-exp="1"]{grid-template-columns:430px minmax(0,1fr) 392px}
.rail{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0 2px 2px;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.rail-h b{color:var(--mut);font-weight:700}

/* games rail */
.gcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;
  padding:8px 9px;cursor:pointer;position:relative;transition:border-color .12s,background .12s;
  border-left:3px solid transparent}
.gcard:hover{border-color:var(--border);background:var(--surface-2)}
.gcard:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.gcard.on{border-color:var(--acc);border-left-color:var(--acc);background:var(--acc-soft)}
.gcard .teams{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;letter-spacing:.01em}
.gcard .teams .at{color:var(--faint);font-weight:600;font-size:.72rem}
.gcard .ln{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.7rem;color:var(--mut);
  font-variant-numeric:tabular-nums}
.gcard .ln b{color:var(--fg);font-weight:700}
.gcard .ko{margin-top:3px;font-size:.64rem;color:var(--faint);font-variant-numeric:tabular-nums}
.gcard .cnt{position:absolute;top:8px;right:9px;font-size:.62rem;font-weight:700;color:var(--faint);
  font-variant-numeric:tabular-nums}
.gcard.on .cnt{color:var(--acc-text)}
.allgames{display:flex;align-items:center;gap:7px;width:100%;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:9px;padding:9px 10px;cursor:pointer;
  font:inherit;font-size:.78rem;font-weight:700;color:var(--fg);text-align:left}
.allgames:hover{border-color:var(--border);background:var(--surface-2)}
.allgames svg{flex:0 0 auto;width:13px;height:13px}
.allgames.armed{border-color:var(--acc);color:var(--acc-text);background:var(--acc-soft)}
.allgames small{font-weight:500;color:var(--mut);margin-left:auto}

/* data rail */
.dcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:8px 10px}
.dcard .k{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.dcard .v{font-size:1.02rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.dcard .v small{display:block;font-weight:500;color:var(--mut);font-size:.68rem;margin-top:1px;
  letter-spacing:0;text-transform:none}
.drow{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;padding:2px 0;color:var(--mut)}
.drow b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}

/* the filtered-to-one-game banner above the table */
.gbanner{display:none;align-items:center;gap:9px;background:var(--acc-soft);border:1px solid var(--acc);
  border-radius:9px;padding:8px 11px;font-size:.8rem;font-weight:600;color:var(--acc-text)}
.gbanner.on{display:flex}
.gbanner button{margin-left:auto;font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 9px;color:var(--fg)}
.gbanner button:hover{border-color:var(--acc)}

@media (max-width:1400px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .rail-right{grid-column:1/-1;position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  .rail-right .dcard{flex:1 1 150px}
}
@media (max-width:1400px){.shell[data-exp="1"],.shell.shell-dfs[data-exp="1"]{grid-template-columns:430px minmax(0,1fr)}}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .shell[data-exp="1"],.shell.shell-dfs[data-exp="1"]{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none}
  .rail-left{flex-direction:row;flex-wrap:wrap}
  .rail-left .gcard{flex:1 1 210px}
  .rail-left .rail-h,.rail-left .allgames{flex:1 1 100%}
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px}
.kpi .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.kpi .v{font-size:.95rem;font-weight:700;margin-top:2px}
.kpi .v small{font-weight:500;color:var(--mut);font-size:.7rem}

.anchor-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:4px;width:fit-content}
.anchor-tab{font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:7px;border:0;background:transparent;color:var(--mut);cursor:pointer;white-space:nowrap}
.anchor-tab.on{background:var(--acc-soft);color:var(--acc-text)}
.anchor-tab:hover:not(.on){color:var(--fg)}

.gapchk{color:var(--warn,#d98a00);font-weight:600}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:9px 11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:ui-monospace,monospace;font-size:.7rem;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--mut);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{background:var(--agree-soft);border-color:var(--agree-border);color:var(--up);font-weight:600}
.chip.on.neutral{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-text)}
.chip .n{opacity:.65;margin-left:4px}
.expand-toggle{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mut);cursor:pointer;user-select:none;white-space:nowrap}
.expand-toggle input{accent-color:var(--acc)}
.filterbar select,.filterbar input[type=text],.filterbar input[type=number]{font:inherit;font-size:.78rem;background:var(--surface-2);color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:5px 8px}
.filterbar input[type=number]{width:56px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;margin-left:auto}
.search input{background:transparent;border:0;outline:0;color:var(--fg);font-size:.78rem;width:150px}
.search svg{width:12px;height:12px;color:var(--faint)}
label.f{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--mut);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
.card>.pad{padding:10px 12px}
.tablescroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
thead th{text-align:left;font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);cursor:pointer}
thead th.r{text-align:right}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--surface-2)}
tbody tr.row td{padding:8px 10px;border-bottom:1px solid var(--border-soft);font-size:.81rem;vertical-align:middle}
tbody tr.row.held td{background:var(--held)}
tbody tr.row.q td{background:var(--q)}
td.r{text-align:right}

.prop-cell{display:flex;flex-direction:column;gap:1px}
.prop-player{font-weight:600}
.prop-sub{font-size:.71rem;color:var(--mut);display:flex;align-items:center;gap:5px;flex-wrap:wrap}

.idchip{display:inline-flex;align-items:center;gap:7px;min-width:0}
/* Two fills travel on every chip: --f is the team's exact colour, --fd the one lifted to stay
   visible on the brand's near-black surface. Dark is the default, so --fd wins unless the reader
   has forced the light theme. */
.idshield{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:700;letter-spacing:.02em;line-height:1;
  background:var(--fd,var(--f));color:var(--cd,var(--c));
  box-shadow:inset 0 0 0 1.5px var(--ring,rgba(0,0,0,.25));font-variant-numeric:tabular-nums}
:root[data-theme="light"] .idshield{background:var(--f);color:var(--c)}
.idshield.sm{width:20px;height:20px;border-radius:5px;font-size:8px}
.idshield span{transform:translateY(.5px)}
.idmeta{display:flex;flex-direction:column;min-width:0;gap:1px}
.idpos{display:inline-flex;align-items:center;justify-content:center;height:14px;padding:0 4px;
  border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.03em;line-height:1;
  background:var(--surface-3);color:var(--mut);border:1px solid var(--border-soft);
  font-variant-numeric:tabular-nums}
.idpos.role{min-width:14px;padding:0 3px}
.idchip .derived{opacity:.92}
@media (max-width:720px){.idshield{width:22px;height:22px;font-size:8px}}

.side{font-family:ui-monospace,monospace;font-size:.62rem;font-weight:600;padding:1px 5px;border-radius:4px;margin-left:5px}
.side.over{background:var(--up-soft);color:var(--up)}
.side.under{background:var(--down-soft);color:var(--down)}

.pcell{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.pcell b{font-weight:700}
.pcell small{font-size:.65rem;color:var(--faint)}
.pcell b.qout{color:#e0574a;text-decoration:underline dotted;cursor:help}
.spread{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.spread .rng{font-weight:600}
.spread small{font-size:.62rem;color:var(--faint)}

.mchip{display:inline-flex;align-items:center;height:14px;padding:0 5px;border-radius:4px;
 font-size:9.5px;font-weight:700;letter-spacing:.02em;line-height:1;border:1px solid var(--border-soft);
 background:var(--surface-3);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.mchip.soft{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up);
 border-color:color-mix(in srgb,var(--up) 32%,transparent)}
.mchip.tough{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down);
 border-color:color-mix(in srgb,var(--down) 32%,transparent)}
.mchip.unproven{opacity:.6}
.delta{font-weight:600}
.delta.pos{color:var(--up)} .delta.neg{color:var(--down)} .delta.flat{color:var(--mut)}
.gap.pos{color:var(--up)} .gap.neg{color:var(--down)}

.pill{font-family:ui-monospace,monospace;font-size:.66rem;padding:2px 7px;border-radius:99px;font-weight:600;display:inline-block;white-space:nowrap}
.c-high{background:var(--up-soft);color:var(--up)} .c-medium{background:var(--acc-soft);color:var(--acc-text)}
.c-low{background:var(--down-soft);color:var(--down)} .c-none{background:var(--stay-soft);color:var(--stay)}
.lab{font-size:.66rem;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.lab.both_agree{background:var(--up-soft);color:var(--up)}
.lab.model_only,.lab.market_only{background:var(--acc-soft);color:var(--acc-text)}
.lab.disagree{background:var(--down-soft);color:var(--down)}
.lab.proxy_stat,.lab.insufficient_data,.lab.no_history,.lab.unmodeled_stat,.lab.quarantined{background:var(--stay-soft);color:var(--stay)}
.betchip{font-family:ui-monospace,monospace;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:99px;display:inline-block;white-space:nowrap;letter-spacing:.03em}
.betchip.bet{background:var(--up-soft);color:var(--up)}
.betchip.pass{background:var(--down-soft);color:var(--down)}
.betchip.thin{background:var(--acc-soft);color:var(--acc-text)}
.betchip.na{background:var(--stay-soft);color:var(--stay)}

.trend{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600}
.trend svg{width:11px;height:11px}
.trend.up{color:var(--up)} .trend.down{color:var(--down)} .trend.flat{color:var(--stay)}
.chev{width:8px;height:8px;color:var(--faint);transition:transform .15s}
tr.row.open .chev{transform:rotate(90deg);color:var(--acc)}

tr.detail td{padding:0;border-bottom:1px solid var(--border-soft)}
tr.detail{display:none}
tr.detail.open{display:table-row}
.detail{padding:14px 18px 16px;background:var(--surface-2);display:grid;gap:22px;grid-template-columns:1fr 1fr}
tr.detail .detail{position:sticky;left:0;width:var(--vw,auto);box-sizing:border-box}
.detail .dcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.detail .dside{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-text);
  border-bottom:1px solid var(--border);padding-bottom:4px}
.detail .gsread{font-weight:600}
.env{display:inline-block;font-size:10px;font-weight:700;padding:0 6px;border-radius:6px;border:1px solid var(--border);color:var(--mut);margin-left:4px}
.env.shootout{color:#e0b341;border-color:rgba(224,179,65,.45)}.env.lopsided{color:var(--acc-text)}.env.dead{color:var(--down)}.env.ctype{color:var(--fg)}
.dfsrow{flex-wrap:wrap}.dfsprops{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.ptag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--surface-3,#262b33);color:var(--mut)}
.ptag b.up{color:var(--up)}.ptag b.dn{color:var(--down)}
@media(max-width:820px){.detail{grid-template-columns:1fr}}
.detail h4{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:0 0 6px;font-weight:600}
.detail .hint{font-size:.7rem;color:var(--faint);margin:-2px 0 8px}
/* GRAHAM: trait sentences and the game brief (viz/grahamnotes.py) */
.gr-lines{list-style:none;padding:0;margin:4px 0 0}
.gr-lines li{font-size:.74rem;line-height:1.4;padding:3px 0;border-bottom:1px dashed var(--border-soft)}
.gr-lines li b{color:var(--fg)}
.gr-brief{white-space:pre-wrap;font-size:.8rem;line-height:1.55;background:var(--surface-2);border-left:3px solid var(--acc);
  padding:8px 11px;border-radius:6px;margin:6px 0}
.gr-meta{font-size:.66rem;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 10px;margin:2px 0 4px}
.gr-meta .env{font-size:.62rem}
.gr-status{color:var(--mut);font-weight:700}
.gr-stale{font-size:.72rem;color:#e0b341;border:1px solid rgba(224,179,65,.4);border-radius:6px;padding:5px 8px;margin:4px 0}
.gr-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:8px 11px;margin:6px 0 8px}
.gr-card details summary{cursor:pointer;font-size:.74rem;font-weight:700;color:var(--mut)}
.gr-card h4{margin:0 0 3px;font-size:.78rem}
/* the flag on a rail card: which games have a write-up to expand */
.gcard .grflag{position:absolute;bottom:7px;right:8px;display:inline-flex;align-items:center;gap:3px;
  font-size:.58rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc-text);
  background:var(--acc-soft);border:1px solid var(--acc);border-radius:999px;padding:1px 6px;line-height:1.5}
.gcard .grflag svg{width:8px;height:8px}
.gcard .grflag.feat{background:var(--acc);color:#0b0e12;border-color:var(--acc)}
/* item 2: the prose is plain English, the technical stat is one hover away */
.jarg{border-bottom:1px dotted var(--acc);cursor:help}
/* item 4a: the film room, three unit matchups from the charting data */
ul.film{list-style:none;padding:0;margin:4px 0 0}
ul.film li{font-size:.74rem;line-height:1.45;padding:4px 0;border-bottom:1px dashed var(--border-soft)}
ul.film li small{display:block;color:var(--faint);font-size:.63rem;text-transform:uppercase;letter-spacing:.04em}
.gcard.on .grflag{background:var(--surface);border-color:var(--acc)}
.gcard.hasgr{padding-bottom:26px}
/* the expanded game view: the brief beside the full set of odds */
.grx{background:var(--surface);border:1px solid var(--acc);border-radius:10px;margin:-2px 0 8px;overflow:hidden}
/* it hangs off its own card: no gap between the two, and the card keeps the square bottom */
.rail-left .gcard.on{border-bottom-left-radius:0;border-bottom-right-radius:0}
.rail-left .grx{border-top-left-radius:0;border-top-right-radius:0}
.gcard.dim{opacity:.5}
.grx>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:var(--acc-soft);font-size:.78rem;font-weight:700}
.grx>summary::-webkit-details-marker{display:none}
.grx>summary .chev{margin-left:auto;transition:transform .15s;flex:0 0 auto}
.grx[open]>summary .chev{transform:rotate(180deg)}
.grx>summary .sub{font-weight:400;color:var(--mut);font-size:.68rem}
.grx-body{display:grid;grid-template-columns:minmax(0,1fr);gap:10px 16px;padding:10px 12px 12px}
.grx-body>section{min-width:0}
.grx-body h5{margin:0 0 5px;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.grx-body section+section h5{margin-top:0}
.grx .kp{border-top:1px dashed var(--border-soft);padding:6px 0;font-size:.74rem}
.grx .kp:first-of-type{border-top:0}
.grx .kp .who{font-weight:700}
.grx .kp .sy{color:var(--mut);font-size:.7rem}
.grx .kp .spark{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:3px}
.grx .kp .spark i{flex:0 0 auto;width:4px;background:var(--acc);border-radius:1px;opacity:.55}
.grx .kp .spark i:last-child{opacity:1}
.grx .kp .mv{font-variant-numeric:tabular-nums;font-weight:700}
.grx .kp .mv.up{color:var(--up)}.grx .kp .mv.down{color:var(--down)}
.grx .noodds{font-size:.72rem;color:var(--faint)}
body[data-view="mobile"] .grx-body{grid-template-columns:1fr;gap:12px}
.ladder{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.brow{display:grid;grid-template-columns:1.1fr .6fr .7fr .7fr .7fr .8fr;column-gap:8px;align-items:center;padding:6px 9px;font-size:.76rem;border-bottom:1px solid var(--border-soft)}
.brow:last-child{border-bottom:0}
.brow.head{background:var(--surface-3);color:var(--faint);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.brow .r{text-align:right}
.brow.best{background:var(--agree-soft)}
.stat-list{display:flex;flex-direction:column;gap:6px;font-size:.79rem}
.stat-list .row2{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border-soft);padding-bottom:6px}
.stat-list .row2:last-child{border:0;padding-bottom:0}
.stat-list .k{color:var(--mut)}
.trajline{font-family:ui-monospace,monospace;font-size:.73rem;color:var(--mut);word-break:break-word}
.trajline .u{color:var(--up)} .trajline .d{color:var(--down)}
.tag{display:inline-block;font-size:.7rem;background:var(--surface-3);color:var(--mut);padding:2px 7px;border-radius:5px}
.qreasons{font-size:.75rem;color:var(--down)}
.empty{padding:32px 16px;text-align:center;color:var(--mut);font-size:.83rem}
details summary{cursor:pointer;font-size:.86rem;font-weight:600;padding:10px 12px}
details .body{padding:0 12px 12px}
.hitc{display:inline-block;min-width:58px;text-align:center;padding:3px 6px;margin-right:4px;
  border-radius:7px;background:var(--surface-2,#1b1f26);border:1px solid rgba(255,255,255,.08);
  font-variant-numeric:tabular-nums;font-size:12.5px}
.hitc small{display:block;font-size:9.5px;opacity:.65;white-space:nowrap}
.hitc.hi{background:rgba(35,221,121,.16);border-color:transparent;color:#23dd79}
.hitc.lo{background:rgba(255,99,99,.16);border-color:transparent;color:#ff6363}
.hitc.off{opacity:.45}
.subtabs{max-width:1800px;margin:8px auto 0;padding:0 16px;display:flex;gap:8px}
.subtab{padding:7px 16px;border-radius:10px 10px 0 0;border:1px solid var(--border);border-bottom:none;
 color:var(--mut);text-decoration:none;font-weight:650;font-size:.85rem;background:var(--surface-2,#171a20)}
.subtab.on{color:var(--fg);background:var(--surface,#12151a);border-bottom:2px solid var(--acc-text,#3fae6a)}
.shell.shell-dfs{grid-template-columns:262px minmax(0,1fr) 392px}
@media (max-width:1400px){.shell.shell-dfs{grid-template-columns:248px minmax(0,1fr)}}
@media (max-width:980px){.shell.shell-dfs{grid-template-columns:minmax(0,1fr)}
 #poolRail{max-height:none}#poolRail #poolList{max-height:46vh;overflow-y:auto}}
.buildbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--border);color:var(--mut);
 padding:5px 12px;cursor:pointer;font-size:.74rem;font-weight:700}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc-soft);color:var(--acc-text)}
.pd-btn.gen{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-text);font-weight:700;padding:5px 16px}
.pd-btn.on{border-color:var(--acc);color:var(--acc-text);background:var(--acc-soft)}
.postabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
/* The pool rail scrolls inside itself, so its filters are pinned to the top of that scroll box:
   the position tabs, sort and search stay in reach however far down the list is. */
.pool-head{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:6px;margin-bottom:2px;
  box-shadow:0 8px 8px -8px rgba(0,0,0,.35)}
.pool-head .postabs{margin-bottom:4px}
@media (max-width:980px){.pool-head{position:static;box-shadow:none}}
/* ── the mobile view, this page's share of it (viz/brand.VIEW_CSS has the platform rules) ──
   Two three-column screens live here -- the pick'em board and the optimizer -- and both become one
   column of full-width blocks. The optimizer's order is the order you work in: pick the contest,
   read the games, generate, read the tickets, then dig in the player pool. */
body[data-view="mobile"] .shell.shell-dfs{grid-template-columns:none}
/* the pool rail is a LIST, not the stat tiles the shared .rail-right rule lays out two-up; block
   layout also gives the working order for free, because that is already the DOM order:
   games -> contest + generate + tickets -> the player pool */
body[data-view="mobile"] #poolRail{display:block;margin-top:14px}
body[data-view="mobile"] #poolRail #poolList{max-height:none;overflow:visible}
body[data-view="mobile"] .pool-head{position:sticky;top:52px;z-index:12;padding-top:8px;
  box-shadow:0 8px 8px -8px rgba(0,0,0,.45)}
body[data-view="mobile"] .prow{padding:9px 10px;gap:8px;min-height:44px;flex-wrap:wrap}
body[data-view="mobile"] .prow .nm{flex:1 1 100%}
body[data-view="mobile"] .lugrid{grid-template-columns:1fr}
body[data-view="mobile"] .vpicks{grid-template-columns:1fr}
body[data-view="mobile"] .buildbar{gap:8px}
body[data-view="mobile"] .buildbar .seg{flex:1 1 100%}
body[data-view="mobile"] #genBtn{flex:1 1 100%}
body[data-view="mobile"] .stk .legs{grid-template-columns:1fr}
/* the player drawer is a sheet that comes up from the bottom, not a centred desktop modal */
body[data-view="mobile"] #poolDrawer .pd-panel{top:auto;bottom:0;left:0;transform:none;
  width:100%;max-height:88vh;border-radius:16px 16px 0 0}
body[data-view="mobile"] #poolDrawer .pd-head{position:sticky;top:0;background:var(--surface);z-index:2;
  flex-wrap:wrap;gap:6px;padding:10px 12px}
body[data-view="mobile"] #poolDrawer .pd-head #pdTitle{flex:1 1 100%;font-size:1.02rem}
body[data-view="mobile"] #poolDrawer .pd-btn{font-size:.72rem;padding:8px 10px;white-space:nowrap}
body[data-view="mobile"] .ladder .brow{grid-template-columns:1fr auto auto;row-gap:2px}
body[data-view="mobile"] .ladder .brow span:nth-child(n+4){display:none}
body[data-view="mobile"] .gbanner{flex-wrap:wrap}
.ptab{padding:3px 9px;border-radius:7px;border:1px solid var(--border-soft);background:var(--surface);
 color:var(--mut);cursor:pointer;font-size:.7rem;font-weight:700}
.ptab.on{border-color:var(--acc);color:var(--acc-text);background:var(--acc-soft)}
.selbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.selbar button{appearance:none;font:inherit;font-size:.66rem;font-weight:700;cursor:pointer;
  background:var(--surface-2);color:var(--mut);border:1px solid var(--border-soft);border-radius:999px;
  padding:4px 9px;white-space:nowrap}
.selbar button:hover:not(:disabled){color:var(--fg);border-color:var(--border)}
.selbar button:disabled{opacity:.42;cursor:default}
.selbar button.feat{color:var(--acc)}.selbar button.exc{color:var(--down)}
/* the legend is a header ROW, each cell the same width as the column it names, so a bare "%" is read
   off the thing it describes instead of out of a sentence underneath (Josh, 2026-09-26) */
.poolkey{display:flex;align-items:center;gap:6px;margin-top:6px;padding:3px 7px;
  font-size:.56rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--border-soft)}
.poolkey span{cursor:help}
.poolkey .k-star{flex:0 0 auto;width:17px;cursor:default}
.poolkey .k-nm{flex:1;min-width:0;cursor:default}
.poolkey .k-lean{flex:0 0 auto;min-width:11px;text-align:center}
.poolkey .k-sl{min-width:46px;text-align:right}
.poolkey .k-tdo{min-width:30px;text-align:right}
.poolkey .k-pv{min-width:40px;text-align:right}
.poolkey .k-pj{min-width:36px;text-align:right}
/* the star: one control, three states -- neutral, featured, excluded */
.prow .star{flex:0 0 auto;appearance:none;background:none;border:0;cursor:pointer;padding:0 2px;
  font-size:.86rem;line-height:1;color:var(--faint);opacity:.45;transition:opacity .12s,color .12s}
.prow .star:hover{opacity:1;color:var(--fg)}
.prow.feat .star{color:var(--acc);opacity:1}
.prow.exc .star{color:var(--down);opacity:1}
.prow .lean{flex:0 0 auto;font-size:.66rem;font-weight:700;min-width:11px;text-align:center}
.prow .lean.over{color:var(--up)}.prow .lean.under{color:var(--down)}.prow .lean.even{color:var(--faint);opacity:.45}
.prow{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;border:1px solid transparent;
 cursor:pointer;font-size:.74rem;border-left:3px solid transparent}
.prow:hover{background:var(--surface-2);border-color:var(--border-soft)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{color:var(--faint);font-size:.64rem;margin-left:4px}

<script>
/* The view switch (viz/brand.py). One key for the whole platform, set before paint so a phone does
   not flash the desktop board first. Labels for the card layout are copied off each table's own
   <th> by index -- the boards re-render their tbody on every filter, sort and tab change, so a
   debounced MutationObserver re-stamps rather than assuming one pass is enough. */
(function(){
  var KEY='propai.view', mq=window.matchMedia('(max-width:820px)');
  function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function mode(){var v=stored();return (v==='mobile'||v==='desktop')?v:(mq.matches?'mobile':'desktop')}
  /* A cell holding nothing but a dash is a book that did not post this line. On a wide table it is
     one quiet character; as a card row it is a labelled line of noise, and the All Sports board has
     up to 19 of them per card. They are marked here and hidden by the CSS. */
  var EMPTY=/^[\s—–-]*$/, RANK=/^[#\s]*\d+[.)]?$/;
  function stamp(){
    if(document.body.getAttribute('data-view')!=='mobile')return;
    var tables=document.querySelectorAll('table');
    for(var t=0;t<tables.length;t++){
      var ths=tables[t].querySelectorAll('thead th'); if(!ths.length)continue;
      var labs=[];for(var i=0;i<ths.length;i++)labs.push((ths[i].textContent||'').trim());
      var rows=tables[t].querySelectorAll('tbody tr');
      for(var r=0;r<rows.length;r++){
        if(rows[r].className.indexOf('detail')>=0)continue;
        var tds=rows[r].children, ti=-1;
        /* The card's title is the first cell that names the thing -- not the first cell. The NFL
           board leads with a rank, so "1" was being used as the heading while the player sat in a
           label/value pair underneath it. */
        for(var c=0;c<tds.length;c++){
          var tx=(tds[c].textContent||'').trim();
          if(tx.length>2&&!RANK.test(tx)){ti=c;break}
        }
        if(ti<0)ti=0;
        for(var c=0;c<tds.length;c++){
          if(labs[c])tds[c].setAttribute('data-label',labs[c]);
          tds[c].removeAttribute('data-na');tds[c].removeAttribute('data-rank');tds[c].removeAttribute('data-title');
          if(c===ti){tds[c].setAttribute('data-title','1');continue}
          var txt=tds[c].textContent||'';
          tds[c].removeAttribute('data-wide');
          if(c<ti&&RANK.test(txt.trim()))tds[c].setAttribute('data-rank','1');
          else if(EMPTY.test(txt)&&!tds[c].querySelector('img,svg'))tds[c].setAttribute('data-na','1');
          else if((txt.trim().length+(labs[c]||'').length)>20)tds[c].setAttribute('data-wide','1');
        }
      }
    }
  }
  /* The filter rows become one sheet behind a single button, with the search left out in front of it
     -- searching is how you navigate a board on a phone, so it must never be a tap away. */
  function filters(){
    if(document.querySelector('.pa-filtbtn'))return;
    var bars=[].slice.call(document.querySelectorAll('.filterbar'));
    if(!bars.length)return;
    var host=bars[0].parentNode;

<script>
const D=JSON.parse(document.getElementById('data').textContent);

// ── the split payload (nfl/payload_split.py) ──────────────────────────────────
// The page used to ship 24.45 MB of JSON, ~15 MB of it drawer-only and most of that copied onto
// every prop of a player on every platform. It now ships 3.3 MB and fetches a player's detail when
// his drawer opens. D.detail_base is absent on an --embed render (a file:// page cannot fetch), and
// everything below degrades to "it was already on the row".
const DBASE=D.detail_base||null;
const fkey=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'unknown';

// Per-player constants (player, team, position, depth_title, ...), the team mark and the interned
// matchup chip go back onto every row at boot, so every reader below sees the row it always saw.
(function hydrate(){
 const P=D.players||{}, M=D.marks||{}, CH=D.matchup_chips||[];
 Object.values(D.anchors||{}).forEach(a=>(a.rows||[]).forEach(r=>{
  const p=P[r.player_key]||{};
  for(const k in p){if(k!=='abbr'&&r[k]===undefined)r[k]=p[k]}
  const abbr=p.abbr||r.team;
  if(!r.mark) r.mark=M[abbr]||{abbr:abbr,title:r.team||abbr,known:false};
  if(r.team===undefined&&r.mark) r.team=r.mark.title||abbr;
  if(r.mci!=null&&CH[r.mci]) r.mchip=CH[r.mci];
 }));
})();

// One fetch per player, cached, and never twice concurrently for the same key.
const DETAIL=new Map(), DETAIL_PENDING=new Map();
async function fetchJSON(rel){
 const res=await fetch(DBASE+'/'+rel,{cache:'no-store'});
 if(!res.ok) throw new Error(rel+': '+res.status);
 return res.json();
}
function detailOf(pk){return DETAIL.get(pk)||null}
async function loadPlayer(pk){
 if(!DBASE||!pk) return null;
 if(DETAIL.has(pk)) return DETAIL.get(pk);
 if(DETAIL_PENDING.has(pk)) return DETAIL_PENDING.get(pk);
 const job=fetchJSON('players/'+fkey(pk)+'.json')
  .catch(e=>{console.warn('detail',pk,e.message);return null})
  .then(d=>{DETAIL.set(pk,d);DETAIL_PENDING.delete(pk);return d});
 DETAIL_PENDING.set(pk,job);
 return job;
}
// Merge a player's detail onto every row of his, so the drawer's own readers (matchupBlock,
// newsBlock, dfsBlock, stats2, ...) find r.matchup / r.news / r.dfs exactly where they look.
function applyDetail(pk,d){
 if(!d) return;
 Object.values(D.anchors||{}).forEach(a=>(a.rows||[]).forEach(r=>{
  if(r.player_key!==pk) return;
  ['news','profile','dfs','club_news','club_injury','injury_status'].forEach(f=>{
   if(d[f]!==undefined&&r[f]===undefined) r[f]=d[f]});
  const P=(d.props||{})[r.anchor+'|'+r.stat+'|'+r.side];
  if(P) for(const f in P){if(r[f]===undefined)r[f]=P[f]}
 }));
}
// Team-level detail (the club newsroom headlines and the club injury report) is one file per team,
// not one per player: 108 players shared 108 copies of it.
// Keyed by the team's FULL NAME, because that is what a board row's `team` holds ("Buffalo Bills",
// not "BUF") and so what payload_split named the file after: teams/buffalo-bills.json.
async function loadTeam(team){
 const k='team:'+team;
 if(!DBASE||!team||DETAIL.has(k)) return DETAIL.get(k)||null;
 const d=await fetchJSON('teams/'+fkey(team)+'.json').catch(()=>null);
 DETAIL.set(k,d);
 if(d) Object.values(D.anchors||{}).forEach(a=>(a.rows||[]).forEach(r=>{
  if(r.team!==team) return;
  if(d.club_news&&r.club_news===undefined) r.club_news=d.club_news;
  if(d.club_injury&&r.club_injury===undefined) r.club_injury=d.club_injury;
 }));
 return d;
}
// The games rail card's expansion: the full odds ladder and this game's GRAHAM write-up.
const GAMEDETAIL=new Map();
async function loadGame(away,home){
 const key=away+'@'+home;
 if(!DBASE||GAMEDETAIL.has(key)) return GAMEDETAIL.get(key)||null;
 const d=await fetchJSON('games/'+fkey(key)+'.json').catch(()=>null);
 GAMEDETAIL.set(key,d);
 return d;
}
const LABELS=['books_agree','both_agree','price_agrees','model_only','books_disagree','disagree','price_disagrees','market_only','proxy_stat','insufficient_data','no_history','unmodeled_stat'];
const LABEL_TEXT={books_agree:'Books & Model Agree',both_agree:'Line Gap & Model Agree',price_agrees:'Platform Price Agrees',model_only:'Model Only (unpriced)',books_disagree:'Books vs Model',disagree:'Line Gap vs Model',price_disagrees:'Platform Price vs Model',market_only:'Market Only',proxy_stat:'Proxy Stat',insufficient_data:'Insufficient Data',no_history:'No History',unmodeled_stat:'Unmodeled'};
// What each bucket actually measures -- the chips carry this as a tooltip, because "Model Only"
// used to be read as "nothing priced it" when it only ever meant "no other book posts this LINE".
const LABEL_HELP={
 books_agree:'Two or more books priced this prop and the de-vigged consensus leans the same way our model does. The strongest confirmation on the board.',
 both_agree:'Other books post a materially different LINE (>= 0.4) and our model leans the same way that gap does. This is line shopping, not a price read.',
 price_agrees:'The only price on this prop is the platform you would bet on. Its de-vigged price leans the same way our model does -- real, but a platform agreeing with itself says more about what you pay than about whether the line is soft.',
 model_only:'Nothing priced this prop at all and no other book posts the line. The model is on its own here.',
 books_disagree:'Two or more books priced it and the consensus leans the OTHER way from our model. Review; do not act on the disagreement itself.',
 disagree:'Other books post a different line and our model leans against that gap.',
 price_disagrees:'The platform priced this against our model. On a priced pick that also means you are paying up for the side we like less.',
 market_only:'A market read exists but the projection is too thin (confidence none/low) to weigh in.',
 proxy_stat:'A projection column, not a priced market (Fantasy Score).',
 insufficient_data:'Neither the market nor the model has enough to say anything.',
 no_history:'No weekly history for this player.',
 unmodeled_stat:'This stat has no projection recipe.'};
const ORDER={books_agree:0,both_agree:1,price_agrees:2,model_only:3,books_disagree:4,disagree:5,price_disagrees:6,market_only:7,proxy_stat:8,insufficient_data:9,no_history:10,unmodeled_stat:11,quarantined:12};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// One chip renderer for every board. `m` is the server-built mark: {abbr,bg,ring,fg,known}.
function idShield(m, small){
  if(!m) return '';
  var cls = 'idshield' + (small ? ' sm' : '') + (m.known ? '' : ' derived');
  return '<span class="' + cls + '" style="--f:' + esc(m.bg) + ';--fd:' + esc(m.bg_dark || m.bg)
       + ';--c:' + esc(m.fg) + ';--cd:' + esc(m.fg_dark || m.fg) + ';--ring:' + esc(m.ring)
       + '" title="' + esc(m.title || m.abbr) + '"><span>' + esc(m.abbr) + '</span></span>';
}
function idPos(text, title, role){
  if(!text) return '';
  return '<span class="idpos' + (role ? ' role' : '') + '" title="' + esc(title || text) + '">'
       + esc(text) + '</span>';
}
function CT(s,withDate){if(!s)return '';if(/^\d{4}-\d\d-\d\d$/.test(String(s)))return String(s).slice(5);var d=new Date(String(s).length<=16&&!/Z|[+-]\d\d:?\d\d$/.test(s)?s+'Z':s);if(isNaN(d))return String(s);
var p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d).forEach(function(x){p[x.type]=x.value});
var t=p.hour+':'+p.minute+' '+(p.dayPeriod||'').toUpperCase()+' CT';return withDate===false?t:p.month+'-'+p.day+' '+t;}
// Opponent rank against this position, for the row itself rather than only the expanded detail.
// rank 1 = allows the MOST of this stat to this position = the SOFTEST matchup, so the ordinal is
// never shown bare: "4th" alone reads as "4th best defense", which is the opposite of the truth.
const ORD=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
function matchupChip(m){
  if(!m || !m.rank || !m.of) return '';
  const st=m.stability, unproven = !!(st && st.stable===false);
  let cls='mchip';
  if(unproven) cls+=' unproven';
  else if(m.rank<=8) cls+=' soft';
  else if(m.rank>m.of-8) cls+=' tough';
  const band = m.rank<=8?'a soft matchup':(m.rank>m.of-8?'a tough matchup':'a middling matchup');
  let t = m.opponent+' allows the '+ORD(m.rank)+'-most '+(m.stat_key||'').replace(/_/g,' ')
        + ' to '+m.position+'s: '+m.avg_allowed+' per game over its last '+m.n_games
        + ' (range '+m.lo+'-'+m.hi+'). Rank 1 of '+m.of+' = allows the most, so this is '+band+'.';
  t += unproven
    ? ' NOTE: this rank does not repeat week to week (split-half r='+st.split_half_r
      +', 95% CI '+st.ci_lo+' to '+st.ci_hi+' includes zero), so read it as history, not a tell.'
    : (st ? ' This rank does repeat week to week (split-half r='+st.split_half_r
      +', 95% CI '+st.ci_lo+' to '+st.ci_hi+', '+st.n_pairs+' defense-seasons).' : '');
  t += ' Context only - nothing here feeds the projection.';
  return '<span class="'+cls+'" title="'+esc(t)+'">vs '+esc(m.opponent)+' '+ORD(m.rank)+'</span>';
}
const pct=x=>x==null?'—':Math.round(x*100)+'%';
const fmt=(x,d=1)=>x==null?'—':(Number.isInteger(x)?String(x):Number(x).toFixed(d));

let anchor=Object.keys(D.anchors)[0], filter='both_agree', showAll=false, openKey=null;
// Click-to-sort (Josh, 2026-09-18). null = the default ranking: sharp market probability first.
let sortCol=null, sortDir=-1;
// A board with no market consensus (the PrizePicks feed carries no prices) has no 'both agree' rows,
// so the default view falls back to the next signal instead of an empty table.
// Open on the strongest bucket that actually has rows, in the order a reader would want them.
function defaultFilter(){const c=counts();return ['books_agree','both_agree','price_agrees','model_only'].find(l=>c[l])||LABELS.find(l=>c[l])||'books_agree'}

const COLS=[['#','#'],['player','Prop'],['anchor_line','Line',1],
 ['market_prob','Mkt P',1,'The sportsbook consensus probability for this side, de-vigged across books (independent of our model).'],
 ['spread','Book spread',1,'How much books disagree with each other on this same side’s price.'],
 ['prob_side','Model P',1,'Our own model’s probability this side hits, from the projection and its uncertainty — built without looking at the market.'],
 ['gap','Model Edge',1,'Model P minus Mkt P, in points. Positive = our model likes this side more than the market does. Negative = the market likes it more than our model does. This is a probability comparison, not a priced wager — see Bet check for that.'],
 ['bet','Bet check',1,'Model P vs this anchor’s own loosest real pick’em-entry breakeven (the smallest bar a leg must clear at ANY entry size on this platform — the same number entry_builder.py’s leg filter uses). Not a full entry’s EV: that still depends on entry size and leg correlation. DraftKings Pick 3 has no static breakeven (peer-to-peer payouts), so it always reads N/A here.'],
 ['proj','Proj / \u0394',1,'Our own number, and how far it sits from the line. On the stats where it was measured walk-forward on two hold-out seasons, this is the model\u2019s MEDIAN rather than its mean: a posted line is a median, and on a right-skewed stat the mean sits above it (the actual landed above our mean only 37-47% of the time). Hover the number to see which.'],['confidence','Proj conf',0,'How much history the PROJECTION rests on (games used, whether the player changed teams) — not how good the bet is. A high-confidence projection can still be a skip.'],['label','Signal'],['trend','Trend'],['','']];

function betCheck(r){
 const flat=D.anchor_breakevens?D.anchor_breakevens[anchor]:null;
 if(flat==null) return {status:'na',text:'N/A',title:'No static breakeven for this platform (peer-to-peer payouts, F9).'};
 if(r.prob_side==null) return {status:'na',text:'No model P',title:'No model probability to compare.'};
 // An entry pays base x PROD(multipliers), so a leg priced at multiplier m has to clear
 // flat/m, not flat. Underdog's multipliers ran 0.6-19.91 on 2026-09-23: judging a 0.81 pick
 // against the flat 53.5% called BET on rows whose real bar was 66%.
 const m=(typeof r.payout_multiplier==='number'&&r.payout_multiplier>0)?r.payout_multiplier:1;
 const be=flat/m;
 const marginPp=(r.prob_side-be)*100, bmPp=(D.breakeven_margin||0.02)*100;
 const beTxt=pct(be)+(m!==1?` (${pct(flat)} base ÷ ${m.toFixed(2)}x this pick pays)`:'');
 if(marginPp>=bmPp) return {status:'bet',text:'BET',need:beTxt,title:`Our model has this at ${pct(r.prob_side)}, clearing the ${beTxt} a leg must hit on this platform by +${marginPp.toFixed(1)}pp.`};
 if(marginPp>0) return {status:'thin',text:'THIN',need:beTxt,title:`Our model has this at ${pct(r.prob_side)} — only +${marginPp.toFixed(1)}pp over the ${beTxt} needed here, inside the ${bmPp.toFixed(0)}pp safety margin.`};
 return {status:'pass',text:'SKIP',need:beTxt,title:`Our model has this at ${pct(r.prob_side)}, below the ${beTxt} a leg has to hit to be worth playing on this platform. "Model & Market agree" only means both lean the same way, and "Proj conf" is about the projection's history — neither says the price is worth taking.`};
}

function anchorRows(a){return (D.anchors[a]&&D.anchors[a].rows)||[]}
function counts(){const c={};anchorRows(anchor).forEach(r=>{if(r.label!=='quarantined')c[r.label]=(c[r.label]||0)+1});return c}

function buildTabs(){$('#tabs').innerHTML=Object.entries(D.anchors).map(([k,v])=>`<button class="anchor-tab ${k===anchor?'on':''}" data-a="${k}">${esc(v.label)}</button>`).join('');
 document.querySelectorAll('.anchor-tab').forEach(b=>b.onclick=()=>{anchor=b.dataset.a;if(!counts()[filter])filter=defaultFilter();buildTabs();buildChips();render()})}

function buildChips(){const c=counts();const order=showAll?LABELS:[filter];const cross=crossingLabels();
 const strong={books_agree:1,both_agree:1,price_agrees:1};
 $('#chips').innerHTML=order.filter(l=>c[l]).map(l=>`<button class="chip ${(!cross&&filter===l)?'on':''}${strong[l]?'':' neutral'}" data-l="${l}" title="${esc(LABEL_HELP[l]||'')}">${LABEL_TEXT[l]} <span class="n">${c[l]}</span></button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.l;buildChips();render()})}

// The option list is position GROUPS (CB covers nflverse's CB and DB, S covers SAF/FS/SS,
// LB covers ILB/MLB/OLB); each option says which spellings it caught so the badge and the
// filter can never look like they disagree.
function buildPosFilter(){const sel=$('#pos');if(!sel)return;const cur=sel.value;const g={};
 Object.values(D.anchors).forEach(a=>a.rows.forEach(r=>{if(!r.position)return;
  const k=r.pos_group||r.position;(g[k]=g[k]||new Set()).add(r.position)}));
 const keys=Object.keys(g).sort();
 sel.innerHTML='<option value="">All positions</option>'+keys.map(k=>{
  const raw=[...g[k]].sort();const lbl=(raw.length>1||raw[0]!==k)?`${k} (${raw.join(', ')})`:k;
  return `<option value="${esc(k)}"${k===cur?' selected':''}>${esc(lbl)}</option>`}).join('');
 if(!keys.includes(cur))sel.value=''}
function buildStatFilter(){buildPosFilter();const sel=$('#stat');const cur=sel.value;const set=new Set();Object.values(D.anchors).forEach(a=>a.rows.forEach(r=>set.add(r.stat)));
 sel.innerHTML='<option value="">All stats</option>'+[...set].sort().map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('')}

function trendSvg(dir){if(dir==='up')return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 9L6 3L10 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 if(dir==='down')return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 3L6 9L10 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6H10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'}
function trendOf(r){
 // r.trend is [direction, magnitude], precomputed in the split; the 8-point series itself is only
 // in the drawer's detail file. Either source gives the same arrow.
 if(r.trend) return {dir:r.trend[0]===0?'flat':(r.trend[0]>0?'up':'down'),mag:r.trend[1]};
 const t=r.trajectory;if(!t||t.length<2)return {dir:'flat',mag:null};const d=t[t.length-1][1]-t[0][1];if(Math.abs(d)<0.05)return {dir:'flat',mag:0};return {dir:d>0?'up':'down',mag:Math.abs(d)}}

function bookSpread(r){const bks=(r.market_detail&&r.market_detail.books)||[];
 if(!bks.length){const s=r.book_summary;   // precomputed in the split; the ladder is drawer-only
  return (s&&s.lo_book!=null)?{lo:{book:s.lo_book,p:s.lo_p},hi:{book:s.hi_book,p:s.hi_p},n:s.n}:null}
 const vals=bks.map(b=>({book:b.book,p:b.at_anchor!=null?b.at_anchor:b.fair}));vals.sort((a,b)=>a.p-b.p);
 return {lo:vals[0],hi:vals[vals.length-1],n:bks.length}}

function gap(r){if(r.prob_side==null||r.market_prob==null)return null;return (r.prob_side-r.market_prob)*100}
// The gap is a WARNING past a measured point, not a strength. On the 2026-09-26 board the median gap
// was 12.4pp, so a "+17pp = strong" badge would have called a third of the board the strongest thing
// on it -- and the rows the projection quarantine already flags have a MEDIAN gap of 34.4pp. Past
// D.gap_check_pp the likeliest explanation is our own number, so the row says so.
// Nothing here reads as strength: that comes from the agreement tier and from graded calibration.
const GAPCHK=()=>(D.gap_check_pp!=null?D.gap_check_pp:25);
function gapBig(r){const g=gap(r);return g!=null&&Math.abs(g)>=GAPCHK()}
function gapNote(r,g){
 if(g==null) return '';
 if(Math.abs(g)>=GAPCHK())
  return `<div class="prop-sub gapchk" title="${esc('Model P is '+Math.abs(g).toFixed(0)
   +'pp from the de-vigged market. Gaps this wide are usually our projection rather than a soft line \u2014 '
   +(D.gap_check_basis||'')+'. Read it as something to check, not as a strong signal.')}">check this \u00b7 ${Math.abs(g).toFixed(0)}pp apart</div>`;
 if(r.label==='both_agree'||r.label==='disagree')
  return `<div class="prop-sub">${g>=0?'model +':'model '}${g.toFixed(0)}pp</div>`;
 return '';}

// ── what number can I actually play, and where ───────────────────────────────
// A median hides the thing Josh trades on: if PrizePicks is at 19 and Underdog at 19.5, the cheap
// end is the side to attack. Platform lines come from nfl.best_line (every pick'em app), book lines
// from this row's own price ladder.
const PLAT_SHORT={prizepicks:'PP',draftkings:'DK',underdog:'UD'};
function platLines(r){const pl=D.best_line&&D.best_line.platform_lines;if(!pl)return null;
 const e=pl[r.player_key+'|'+String(r.stat||'').replace(/ /g,'_')];if(!e)return null;
 const out=[];for(const p of (D.best_line.playable||[])){const s=e[p];if(!s)continue;
  const v=s[r.side]!=null?s[r.side]:(s.Over!=null?s.Over:s.Under);if(v!=null)out.push([p,v])}
 return out.length?out:null}
function bookLineRange(r){const bks=(r.market_detail&&r.market_detail.books)||[];
 if(!bks.length){const s=r.book_summary;
  return (s&&s.line_lo!=null)?{lo:s.line_lo,hi:s.line_hi,loBook:s.line_lo_book,hiBook:s.line_hi_book}:null}
 const ls=bks.map(b=>b.line).filter(v=>v!=null);if(!ls.length)return null;
 const lo=Math.min(...ls),hi=Math.max(...ls);if(lo===hi)return null;
 return {lo,hi,loBook:(bks.find(b=>b.line===lo)||{}).book,hiBook:(bks.find(b=>b.line===hi)||{}).book}}
function lineRange(r){const pls=platLines(r);
 if(pls)return `<small>${pls.map(([p,v])=>`${PLAT_SHORT[p]||p} ${fmt(v)}`).join(' · ')}</small>`;
 const br=bookLineRange(r);
 if(br)return `<small>books ${fmt(br.lo)}–${fmt(br.hi)}</small>`;
 return r.regulated_median!=null?`<small>books ${fmt(r.regulated_median)}</small>`:''}
function lineTitle(r){const pls=platLines(r),br=bookLineRange(r);const parts=[];
 if(pls)parts.push('Playable: '+pls.map(([p,v])=>`${PLAT_SHORT[p]||p} ${v}`).join(' / '));
 if(br)parts.push(`Sportsbooks post ${br.lo} (${br.loBook}) up to ${br.hi} (${br.hiBook}) — if you like this side, take the cheaper end.`);
 else parts.push('Every priced book is on the same number.');
 if(r.regulated_median!=null)parts.push(`Regulated median ${r.regulated_median}.`);
 return parts.join(' ')}

 </td>

 <td class="r"><div class="spread">${spread?`<span class="rng num">${pct(spread.lo.p)}–${pct(spread.hi.p)}</span><small>${spread.n} book${spread.n===1?'':'s'}</small>`:'<span class="rng num">—</span>'}</div></td>
 <td class="r num">${pct(r.prob_side)}</td>

 <td class="r" title="${esc(bc.title)}"><span class="betchip ${bc.status}">${bc.text}</span>${bc.need?`<div class="prop-sub">needs ${bc.need}</div>`:''}</td>
 <td class="r"><div class="pcell"><b class="num${r.quarantined?' qout':''}" data-central="${(D.median_stats||[]).includes(r.stat_key)?'median':'mean'}"${r.quarantined?` title="${esc(r.quarantine_reason||(r.outlier&&r.outlier.reason)||'projection outlier')}"`:''}>${fmt(r.projected_line)}${r.quarantined?' &#9888;':''}</b><small class="delta ${dCls} num">${d==null?'':(d>0?'+':'')+d.toFixed(1)}</small></div></td>
 <td><span class="pill ${cCls}">${r.confidence||'none'}</span>${r.team_changed?' *':''}${(r.n_games_used||(r.games_used&&r.games_used.length))?`<div class="prop-sub">n=${r.n_games_used||r.games_used.length} games</div>`:''}</td>
 <td><span class="lab ${r.label}">${LABEL_TEXT[r.label]||r.label}</span>${magNote}</td>

function rowDetail(r){
 const bks=(r.market_detail&&r.market_detail.books)||[];
 const spread=bookSpread(r);
 const other=r.side==='Over'?'Under':'Over';
 // "Weight" was the consensus maths leaking onto the screen (Josh, 2026-09-16). What the reader
 // wants from a book is: what does it pay both ways, and how seriously should I take it.
 const tier=w=>w>=3?'sharp':w>=1.5?'major':w>=1?'standard':'soft';
 const ladder=bks.length?`<div class="ladder"><div class="brow head"><span>Book</span><span class="r">Line</span><span class="r">${esc(r.side||'')}</span><span class="r">${esc(other)}</span><span class="r">Fair%</span><span class="r">Book type</span></div>${
   bks.slice().sort((a,b)=>(b.at_anchor??b.fair)-(a.at_anchor??a.fair)).map(b=>{
     const p=b.at_anchor!=null?b.at_anchor:b.fair;const best=spread&&b.book===spread.hi.book;
     return `<div class="brow${best?' best':''}"><span>${esc(b.book)}${b.shifted?' <span class="tag">shifted</span>':''}</span><span class="r num">${fmt(b.line)}</span><span class="r num">${am(b.odds)}</span><span class="r num">${b.opposite_odds==null?'—':am(b.opposite_odds)}</span><span class="r num">${pct(p)}</span><span class="r"><span class="tag" title="Counts ${b.weight}x in the consensus (Pinnacle heaviest)">${tier(b.weight)}</span></span></div>`;
   }).join('')}</div>`:'<div class="empty">No book-level detail for this row.</div>';
 const traj=r.trajectory&&r.trajectory.length?r.trajectory.map((t,i)=>{const cls=i&&t[1]>r.trajectory[i-1][1]?'u':i&&t[1]<r.trajectory[i-1][1]?'d':'';return `<span class="${cls}" title="${esc(t[0])}">${t[1]}</span>`}).join(' → '):'no captured history yet';
 // 2026-09-25 (Josh, annotated screenshot): DGF hit%, sigma, "games used" and the distribution
 // chart were clutter without signal and are gone. The drawer is two halves: LEFT is the maths --
 // prices, line vs model, the range and probability, hit rates; RIGHT is the handicapping --
 // matchup, game script, intel claims, news.
 const st=stats2(r);
 const stats=[
   ['Regulated median', fmt(r.regulated_median)],
   ['Line vs regulated', r.divergence_diff==null?'—':(r.divergence_diff>=0?'+':'')+r.divergence_diff],

 ];
 if(r.quarantine_reasons&&r.quarantine_reasons.length) stats.push(['Quarantine reasons', `<span class="qreasons">${esc(r.quarantine_reasons.join('; '))}</span>`]);
 const list=rows=>`<div class="stat-list">${rows.map(([k,v])=>`<div class="row2"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div>`;
 return `<div class="detail">
   <div class="dcol"><div class="dside">The numbers</div>
     <div><h4>Price by book</h4><div class="hint">Both sides, where the book gives us both — a tight gap means the book is confident in its number, a wide one means it is charging for uncertainty. "Shifted" = that book posts a different line, re-expressed at ours.</div>${ladder}</div>
     <div><h4>Line &amp; model</h4>${list(stats)}</div>

   </div>
   <div class="dcol"><div class="dside">Handicapping</div>
     ${grahamBlock(r)}${gameScriptBlock(r)}${matchupBlock(r)}${claimsBlock(r)}${newsBlock(r)}

 </div>`;

// The DFS side of the same player (nfl/dfs_bridge.py): DK salary, projected DK points and range,
// his game's environment, and whether today's cash or GPP build uses him.
function dfsBlock(r){const d=r.dfs;if(!d)return '';
 const rg=d.range?`${d.range.p25} – ${d.range.p75} <small class="prop-sub">(floor ${d.range.p10}, ceiling ${d.range.p90})</small>`:'—';
 const rows=[['Salary / projected', `$${(d.salary||0).toLocaleString()} · <b>${d.proj_mu??'—'}</b> DK pts${d.value!=null?` <small class="prop-sub">${d.value} per $1k</small>`:''}`],
   ['Expected range', rg],
   ...(d.fp_line?[['Market fantasy line',
     `${d.fp_line.ud!=null?'UD '+d.fp_line.ud:''}${d.fp_line.ud!=null&&d.fp_line.pp!=null?' · ':''}${d.fp_line.pp!=null?'PP '+d.fp_line.pp:''}`
     +` <small class="prop-sub">= ${d.fp_line.dk_equiv} DK pts, ${d.mult_market!=null?d.mult_market.toFixed(1)+'x':'—'} — ${d.mult_market!=null&&d.mult_market>=3?'the books price him at the 3x cash bar':'the books do NOT price him at 3x'}</small>`]]:[]),
   ...(d.p_td!=null?[['Anytime TD', `<b>${Math.round(d.p_td*100)}%</b> <small class="prop-sub">${esc(d.td_book||'')} ${d.td_odds>0?'+':''}${d.td_odds}, de-vigged. Ranks reliably; the level runs high.</small>`]]:[]),
   ['Game', d.env?`<span class="env ${esc(d.env)}">${esc(d.env)}</span>${d.implied!=null?` <small class="prop-sub">team implied ${d.implied}</small>`:''}`:'—'],
   ['In today’s build', [d.in_cash?'cash':'',d.in_gpp?'GPP':''].filter(Boolean).join(' + ')||'no'],
   ['', `<a href="#dfs" data-optlink="${esc(r.player_key||'')}">Open in optimizer →</a>`]];
 return `<div><h4>DraftKings</h4><div class="stat-list">${rows.map(([k,v])=>`<div class="row2"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div>`
  +`<div class="hint" style="margin:6px 0 0">Range is the middle half of his DK outcomes (25th–75th percentile, normal approximation).</div></div>`}

// The range and the probability the old distribution chart carried, as two numbers.
function stats2(r){
 if(r.sigma==null||r.projected_line==null) return null;
 const pOver=r.side==='Over'?r.prob_side:(r.prob_side==null?null:1-r.prob_side);
 return {lo:r.projected_line-r.sigma, hi:r.projected_line+r.sigma, pOver, pUnder:pOver==null?null:1-pOver};
}

// Hit rates: how often he, and players in his slot against this defense, cleared THIS line.
function hitBlock(r){
 const m=r.matchup, rc=m&&m.recent;
 if(!rc||!rc.player) return '';
 const strip=h=>['5','10','15','30'].map(n=>{const v=h&&h[n];
   if(!v||v.pct==null)return '<span class="hitc off">&ndash;<small>L'+n+'</small></span>';
   const c=v.pct>=0.6?' hi':(v.pct<=0.4?' lo':'');
   return '<span class="hitc'+c+'">'+Math.round(v.pct*100)+'%<small>L'+n+' '+v.over+'/'+(v.n-v.push)+'</small></span>';
 }).join('');
 const rows=[['Over '+rc.line+', his last games', strip(rc.player)]];
 if(rc.defense) rows.push([esc(m.opponent)+' allows '+esc(rc.position)+rc.rank+' over '+rc.line, strip(rc.defense)]);
 return `<div><h4>Hit rates at this line</h4><div class="hint">Same depth slot on the defense side, one player per game; current + last regular season.</div>
   <div class="stat-list">${rows.map(([k,v])=>`<div class="row2"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div></div>`;
}

// Game script, first on the right: the game's own market (spread, total, his team's implied
// points), then how opponents of this defense tend to play. NFL script is a fourth-quarter effect
// (pass rate is flat by score in the first half and swings to ~33%/77% in Q4), so the read is
// about how likely a lopsided game is, never a multiplier on the projection.
function gameScriptBlock(r){
 const abbr=r.mark&&r.mark.abbr, O=D.game_odds, gs=r.matchup&&r.matchup.game_script;
 const og=abbr&&O&&O.games?O.games.find(g=>g.home===abbr||g.away===abbr):null;
 const rows=[];
 if(og){
   const home=og.home===abbr, sp=oddsBest(og,'game','spread'), to=oddsBest(og,'game','total'), it=impliedTotals(og);
   const opp=home?og.away:og.home;
   const mine=sp?(home?sp.line:-sp.line):null;
   const pts=it?(home?it.home:it.away):null;
   if(mine!=null) rows.push(['Spread', `${esc(abbr)} <b>${sgn(mine)}</b> vs ${esc(opp)}`]);
   if(to) rows.push(['Game total', `<b>${fmt(to.line)}</b>${pts!=null?` <small class="prop-sub">${esc(abbr)} implied ${fmt(pts)} pts</small>`:''}`]);
   if(mine!=null){
     const a=Math.abs(mine);
     const read=a>=7?(mine<0?`${esc(abbr)} expected to lead comfortably: the trailing side throws more late, so his team leans run in the fourth quarter`
                             :`${esc(abbr)} expected to trail: more fourth-quarter passing for his team`)
               :a>=3.5?'a one-score game expected: a mild late-game lean at most'
               :'a coin-flip game: little script effect expected';
     rows.push(['Read', `<span class="gsread">${read}</span>`]);
   }
 }
 if(gs){
   const d=gs.pass_rate_delta;
   const txt=gs.direction==='neutral'?'no clear tilt — opponents play about as they usually do'
     :(d>0?`opponents throw <b>${d.toFixed(1)}pp more</b> than in their other games`:`opponents run more — they throw <b>${Math.abs(d).toFixed(1)}pp less</b> than in their other games`);
   rows.push([`vs ${esc(r.matchup.opponent||'')} defense`, `${txt} <small class="prop-sub">last ${gs.n_games} games · ${gs.plays_per_game} plays/game</small>`]);
 }
 if(!rows.length) return '';
 const meta=D.game_script_meta||{};
 const note=`Script shows up in the fourth quarter, not all game${meta.split_half_r!=null?`; the defense tilt only half-repeats within a season (r = ${meta.split_half_r}), so it is a tiebreaker, never a reason`:''}.`;
 return `<div><h4>Game script</h4><div class="stat-list">${rows.map(([k,v])=>`<div class="row2"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div><div class="hint" style="margin:6px 0 0">${note}</div></div>`;
}

function matchupBlock(r){
 // Rewritten 2026-09-17 to answer the question a prop actually asks -- do players facing this
 // defense beat THEIR OWN number? -- instead of showing yards allowed to a whole position group
 // added together. The earlier version was removed outright on a measurement taken over two
 // seasons; re-run over the four already in the residuals table it reads differently, so the
 // tendency is shown, with its stability printed beside it either way.
 const m=r.matchup; if(!m) return '';
 const t=m.tendency, gs=m.game_script, rows=[];
 // Recent form, added 2026-09-24. Both strips are rank-matched to the same depth slot so
 // they share a denominator -- counting every WR would pull the defence row toward zero
 // by construction and read as a shutdown unit sitting next to the player's own rate.
 // (the hit-rate strips live in hitBlock, left side, since 2026-09-25)
 if(m.rank && m.of){
  // The rank the row's own chip shows, spelled out. Direction stated every time: rank 1 allows
  // the MOST, which is the SOFTEST matchup -- the opposite of how a bare ordinal usually reads.
  const st=m.stability;
  const band = m.rank<=8?{w:'soft matchup',c:'pos'}:(m.rank>m.of-8?{w:'tough matchup',c:'neg'}
             :{w:'middling matchup',c:'flat'});
  rows.push([`${esc(m.opponent)} vs ${esc(m.position)}s, this stat`,
   `<span class="delta ${band.c}">${ORD(m.rank)}-most allowed of ${m.of}</span> `
   +`<small class="prop-sub">${m.avg_allowed}/g over its last ${m.n_games} `
   +`(range ${m.lo}&ndash;${m.hi}) &middot; rank 1 = allows the most, so this is a ${band.w}</small>`]);
  if(st) rows.push([`Does that rank repeat?`, st.stable
   ? `<span class="delta pos">yes</span> <small class="prop-sub">split-half r = ${st.split_half_r} `
     +`(95% CI ${st.ci_lo}&ndash;${st.ci_hi}), ${st.n_pairs} defense-seasons. Measured on every season `
     +`on disk, not on the two the board runs from &mdash; over two the interval is too wide to say.</small>`
   : `<span class="delta neg">no</span> <small class="prop-sub">split-half r = ${st.split_half_r} `
     +`(95% CI ${st.ci_lo}&ndash;${st.ci_hi}) &mdash; the interval includes zero, so this ranking does not `
     +`carry week to week. History, not a tell.</small>`]);
 }
 if(t && t.over_rate!=null){
  const lg=t.league_over_rate, diff=(t.over_rate-lg)*100;
  // The league baseline is ~40%, not 50%: these stats are right-skewed, so the mean projection
  // sits above the median outcome and "under" is the normal case. Comparing to 50% would call
  // every defense a shutdown unit. The number that means anything is the gap from league.
  const lean = Math.abs(diff)<1.5 ? {w:'in line with the league', c:'flat'}
             : diff>0 ? {w:`${diff.toFixed(1)}pp MORE likely to go Over`, c:'pos'}
                      : {w:`${Math.abs(diff).toFixed(1)}pp more likely to go Under`, c:'neg'};
  rows.push([`${esc(m.position)}s vs ${esc(m.opponent)}, this stat`,
    `<span class="delta ${lean.c}">${lean.w}</span> <small class="prop-sub">${(t.over_rate*100).toFixed(1)}% beat their own projection vs ${(lg*100).toFixed(1)}% league · ${t.n} player-games</small>`]);
  rows.push([`Does that repeat?`, t.stable
    ? `<span class="delta pos">yes — weakly but consistently</span> <small class="prop-sub">split-half r = ${t.split_half_r} (95% CI ${t.ci_lo}–${t.ci_hi}), ${t.n_defense_seasons} defense-seasons, ${t.n_rows} player-games 2022-2025</small>`
    : `<span class="delta neg">no</span> <small class="prop-sub">split-half r = ${t.split_half_r} (95% CI ${t.ci_lo}–${t.ci_hi}) — the interval includes zero, so this defense's lean does not carry week to week. Read the number as history, not as a tell.</small>`]);
 }
 if(!rows.length) return '';
 return `<div><h4>Matchup — ${esc(m.position||'')} vs ${esc(m.opponent||'')} defense</h4>
   <div class="stat-list">${rows.map(([k,v])=>`<div class="row2"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div></div>`;
}
