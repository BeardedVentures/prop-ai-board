// GRAHAM (viz/grahamnotes.py, 2026-09-26): the storyteller's profile -- trait sentences over the
// player's own stats and attributed intel -- and, collapsed, his team's profile and the week's
// brief on his game. Every sentence is template text over recorded evidence; the brief is the
// validated model text. Nothing here moves a number.
// Always the full shape, whatever the payload carries. The split leaves `players` out (it is a
// deferred file) and `games` out (each game's write-up arrives with its rail card), and a reader that
// did `GR().players[key]` threw on a board that had a graham block but not that sub-object.
const GR=()=>{const g=D.graham||{};
 return {players:GPLAYERS||g.players||{},teams:g.teams||{},games:g.games||{},
         index:g.index||{},meta:g.meta||{}}};
// The 387 GRAHAM player profiles. A board row carries its own lines as r.profile, so the only reader
// is the DFS pool drawer, for a player who has no prop on any board. Fetched the first time one asks.
let GPLAYERS=null,GPLAYERS_PENDING=false;
function grPlayersLoad(after){
 if(GPLAYERS||GPLAYERS_PENDING||!DBASE) return;
 GPLAYERS_PENDING=true;
 fetchJSON('graham-players.json').then(d=>{GPLAYERS=d||{};if(after)after()})
  .catch(e=>{GPLAYERS={};console.warn('graham-players',e.message)});
}
// the expanded game view starts open and remembers the reader's choice across re-renders
let grxOpen=true;
function grLines(lines){return lines&&lines.length?`<ul class="gr-lines">${lines.map(l=>{const i=l.indexOf(':');
 return `<li>${i>0&&i<28?`<b>${esc(l.slice(0,i))}</b>${esc(l.slice(i))}`:esc(l)}</li>`}).join('')}</ul>`:''}
function grGameKey(abbr){const O=D.game_odds;const g=abbr&&O&&O.games?O.games.find(x=>x.home===abbr||x.away===abbr):null;
 return g?g.away+'@'+g.home:null}
// Every GRAHAM block shows (Rev B item 1.2): its build time, its sources with capture times, its status
// ("model-written, validated" or "template"), a stale flag when the line or a status has moved since
// it was written, and the disclaimer. The profile label is marked unmeasured (2024-25 backtest).
// Item 2: GRAHAM's prose never prints an abbreviation, so the technical name and its value live
// here, on the phrase itself. Matches are found on the ESCAPED text in one pass and spliced by
// position, so a tooltip's own words can never be matched as a second phrase.
function grJargon(txt,terms){
 let h=esc(txt||'');
 const low=h.toLowerCase(), hits=[];
 (terms||[]).slice().sort((a,b)=>(b.phrase||'').length-(a.phrase||'').length).forEach(t=>{
   const p=esc(t.phrase||'').toLowerCase(); if(!p) return;
   let i=low.indexOf(p);
   while(i>=0&&hits.some(x=>i<x.end&&i+p.length>x.start)) i=low.indexOf(p,i+1);
   if(i<0) return;
   const tip=`${t.term}: ${t.value}`+(t.rank?` · ${t.rank} of ${t.of||32}`:'')+(t.team?` (${t.team})`:'');
   hits.push({start:i,end:i+p.length,tip:tip});
 });
 hits.sort((a,b)=>b.start-a.start);
 hits.forEach(x=>{h=h.slice(0,x.start)+`<span class="jarg" title="${esc(x.tip)}">`+h.slice(x.start,x.end)+'</span>'+h.slice(x.end)});
 return h;
}
// Item 4a: the three biggest unit mismatches in this game, each with both sides' numbers and rank.
function grFilmHTML(g){

function grBriefHTML(key,open){
 // through grGame(), so it sees the per-game file once it has landed and the slim index before that
 const parts=String(key||'').split('@');
 const g=(GR().games||{})[key]||grGame(parts[0],parts[1]);
 if(!g)return '';
 if(g._pending)return `<details${open?' open':''}><summary>GRAHAM on ${esc(key.replace('@',' @ '))}${g.featured?' \u00b7 Featured':''}</summary><div class="prop-sub">Loading the write-up\u2026</div></details>`;
 const meta=`<div class="gr-meta"><span>market: <b>${esc(g.market_label||'—')}</b></span><span title="${esc((GR().meta||{}).profile_note||'')}">profiles: <b>${esc(g.profile_label||'—')}</b> (unmeasured)</span>`
  +`<span>${esc(g.agreement||'')}</span>${g.template?`<span>${esc(g.template)}</span>`:''}`
  +`${g.status?`<span class="gr-status">${esc(g.status)}</span>`:''}${g.built_ct?`<span>built ${esc(g.built_ct)}</span>`:''}${g.line_ct?`<span>lines ${esc(g.line_ct)}</span>`:''}</div>`;
 const stale=(g.stale||[]).length?`<div class="gr-stale">The line/status has moved since this was written (built ${esc(g.built_ct||'')}): ${esc(g.stale.join('; '))}.</div>`:'';
 const drivers=(g.drivers||[]).length?`<div class="prop-sub">drivers: ${esc(g.drivers.join(' · '))}</div>`:'';
 const src=(g.sources||[]).length?`<div class="prop-sub">sources: ${esc(g.sources.join(' · '))}</div>`:'';
 const body=g.brief?`<div class="gr-brief">${grJargon(g.brief,g.terms)}</div>`:`<div class="prop-sub">No brief written for this game this week — the script read above is GRAHAM's; every game still to be played gets one, and the three with the most market interest are Featured.</div>`;
 return `<details${open?' open':''}><summary>GRAHAM on ${esc(key.replace('@',' @ '))}${g.featured?' · Featured':''}</summary>${meta}${stale}${drivers}${body}${src}</details>`}
function grTeamHTML(abbr,open){const t=(GR().teams||{})[abbr];if(!t||!t.lines)return '';
 const nm=(D.marks&&D.marks[abbr]&&D.marks[abbr].title)||abbr;
 return `<details${open?' open':''}><summary>${esc(nm)} — team profile</summary>${grLines(t.lines)}</details>`}
function grahamBlock(r){const G=GR();
 // A board row's own profile lines ride in his detail file. Only a DFS-pool-only player needs the
 // table, so asking for it here is what triggers the one fetch.
 if(!(r.profile&&r.profile.length)&&!GPLAYERS) grPlayersLoad(()=>render());
 const p=(r.profile&&r.profile.length)?r.profile:(((G.players||{})[r.player_key]||{}).lines||[]);
 const abbr=r.mark&&r.mark.abbr||r.team, key=grGameKey(abbr);
 const team=abbr?grTeamHTML(abbr,false):'', brief=key?grBriefHTML(key,false):'';
 if(!p.length&&!team&&!brief) return '';
 return `<div><h4>GRAHAM profile</h4>${p.length?grLines(p):'<div class="prop-sub">no profile yet (needs a game played)</div>'}${team}${brief}`
  +`<div class="hint" style="margin:6px 0 0">Trait sentences over recorded stats and attributed reports; the brief is GRAHAM's written read. ${esc(G.meta&&G.meta.disclaimer||'')}</div></div>`}
// The game's expanded view on the pick'em board: the brief and both team profiles under the banner.
// The collapsed rail card needs two facts about a game's write-up -- is there one, is it featured --
// and the slim index carries exactly those. The brief, the film room, the key props and both team
// profiles are 6 KB a game and only the card's expansion shows them, so they arrive with loadGame().
function grGame(away,home){
 const key=away+'@'+home;
 const full=(GAMEDETAIL.get(key)||{}).graham;
 if(full) return full;
 const g=GR().games||{};
 if(g[key]) return g[key];                       // an --embed render carries them inline
 const ix=(GR().index||{})[key];
 return ix?{brief:ix.brief?'':null,featured:ix.featured,_pending:true}:null}
// Likewise the odds: the card shows a spread, a total and the implied totals off `best`; the full
// capture ladder behind grOddsTable() is 55 KB a game.
function oddsGame(away,home){
 const key=away+'@'+home;
 const full=(GAMEDETAIL.get(key)||{}).odds;
 if(full) return full;
 return (((D.game_odds||{}).games)||[]).find(g=>g.away===away&&g.home===home)||null}

// The full set of odds for ONE game -- every market and period any book priced, the same rows the
// "Game lines" card shows for the whole slate, narrowed to the expanded game.
function grOddsTable(g){
 // "not captured" and "not fetched yet" are different facts and must not share a message.
 if(g&&!g.latest&&g.best) return '<div class="noodds">Loading the full odds\u2026</div>';
 if(!g||!g.latest||!g.latest.length) return '<div class="noodds">No game odds captured for this one yet.</div>';
 const cols=ODDS_COLS.filter(([s,b])=>ODDS_ROWS.some(([per,m])=>oddsFind(g,s,b,per,m)));
 const rows=ODDS_ROWS.filter(([per,m])=>cols.some(([s,b])=>oddsFind(g,s,b,per,m)));
 if(!rows.length) return '<div class="noodds">No game odds captured for this one yet.</div>';
 const newestBy={};g.latest.forEach(r=>{if(!newestBy[r.source]||r.captured_at>newestBy[r.source])newestBy[r.source]=r.captured_at});
 const stale=r=>r&&(r.captured_at<newestBy[r.source]||Date.now()-Date.parse(r.captured_at)>3*3600e3);
 const body=rows.map(([per,m,label])=>{
   const f=(g.pinnacle_first||[]).find(r=>r.period===per&&r.market===m),cur=oddsFind(g,'pinnacle','pinnacle',per,m);
   const mv=f&&cur&&f.line!=null&&cur.line!==f.line?`<div class="prop-sub">Pinnacle ${sgn(f.line)} → ${sgn(cur.line)} since ${esc(CT(f.captured_at))}</div>`:'';
   const cell=r=>`${oddsCell(r,g)}${stale(r)?`<div class="prop-sub" title="not in this feed's latest capture, or over 3h old">as of ${esc(CT(r.captured_at))}</div>`:''}`;
   return `<tr class="row" style="cursor:default"><td>${label}${mv}</td>${cols.map(([s,b])=>`<td class="r num">${cell(oddsFind(g,s,b,per,m))}</td>`).join('')}</tr>`}).join('');
 return `<div class="tablescroll"><table style="min-width:${120+cols.length*110}px"><thead><tr><th>Market</th>${cols.map(c=>`<th class="r">${c[2]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// The 1-3 props the write-up is about, each with the trail its line has taken since the market opened
// it (graham/keyprops.py). The bars are the DISTINCT steps, not every capture: 28 captures of one
// number are one step, and drawing them as 28 bars would invent a flat line's worth of movement.
function grProps(gr){
 const kps=(gr&&gr.key_props)||[];
 if(!kps.length) return '';
 return kps.map(kp=>{
   const st=kp.story||null, path=(st&&st.path)||[];
   const lo=path.length?Math.min(...path.map(p=>p.line)):0, hi=path.length?Math.max(...path.map(p=>p.line)):0;
   const spark=path.length>1?`<div class="spark" aria-hidden="true">${path.map(p=>{
     const h=hi>lo?4+12*(p.line-lo)/(hi-lo):10;return `<i style="height:${h.toFixed(0)}px"></i>`}).join('')}</div>`:'';
   const dir=st&&st.direction, cls=dir==='up'?'up':(dir==='down'?'down':'');
   const mv=st&&(dir==='up'||dir==='down')?`<span class="mv ${cls}">${dir==='up'?'▲':'▼'} ${fmt(Math.abs(st.delta))}</span>`:'';
   const avg=(kp.avg!=null&&!kp.thin_sample)?` · ${fmt(kp.avg)} a game`:(kp.thin_sample?' · thin sample':'');
   const book=st&&st.anchor?`${esc(st.anchor)}${st.same_book===false?' (a different book than the quoted line)':''}, ${st.captures} capture${st.captures===1?'':'s'}`:esc(kp.book||'');
   return `<div class="kp"><div><span class="who">${esc(kp.player||'')}</span> <span class="prop-sub">${esc(kp.team||'')}${kp.pos?' · '+esc(kp.pos):''}</span> ${mv}</div>
     <div class="sy">${esc(kp.summary||'')}${avg}</div>${spark}
     <div class="prop-sub" style="font-size:.62rem">${book}${st&&st.dropped?` · ${st.dropped} implausible capture${st.dropped===1?'':'s'} dropped`:''}</div></div>`}).join('');
}

function newsBlock(r){
 // The bare "NEWS:1" tag told the reader nothing (Josh, 2026-09-16): show the actual headlines.
 const items=r.news||[];
 const cap=D.news_captured_at?` (capture ${esc(CT(D.news_captured_at))})`:'';
 // A feed that stops arriving must SAY so: otherwise "nothing matched" reads as "no news about him"
 // when it really means "we have no headlines at all any more".
 // Two different failures, and they must not read the same. `in_window: false` means the feed's
 // headlines are gone from the board entirely; `live: false` with `in_window: true` means what is
 // on screen is real but hours old, so an absence of news is not evidence of no news.
 const H=Object.entries(D.news_health||{});
 const dead=H.filter(([,h])=>h.in_window===false), stale=H.filter(([,h])=>!h.live&&h.in_window!==false);
 const when=h=>`${esc(CT(h.last))} (${h.age_h}h ago)`;
 const gap=(dead.length?`<div class="hint" style="color:var(--down)">${dead.map(([s,h])=>`${esc(s)} last reached the board ${when(h)}`).join('; ')} — those headlines are missing, not absent.</div>`:'')
  +(stale.length?`<div class="hint" style="color:#e0b341">${stale.map(([s,h])=>`${esc(s)} last updated ${when(h)}`).join('; ')} — still shown, no longer current.</div>`:'');
 const club=clubBlock(r);
 if(!items.length) return `<div style="margin-top:12px"><h4>News</h4><div class="hint">Nothing matched this player${cap}.</div>${gap}${club}</div>`;
 const body=items.map(n=>{
   const when=CT(n.published);
   const head=n.status?`${esc(n.status)}${n.headline&&n.headline!==n.status?' — '+esc(n.headline):''}`:esc(n.headline||'(no headline)');
   const det=n.detail?`<div class="prop-sub">${esc(n.detail)}</div>`:'';
   const link=n.url?` <a href="${esc(n.url)}" target="_blank" rel="noopener">read</a>`:'';
   return `<div class="row2" style="display:block"><span class="tag">${esc(n.kind||'news')}</span> <b>${head}</b> <small class="prop-sub">${esc(n.source||'')}${when?' · '+when:''}</small>${link}${det}</div>`}).join('');
 return `<div style="margin-top:12px"><h4>News${r.injury_status?` — ${esc(r.injury_status)}`:''}</h4><div class="hint">Matched to this player in the latest capture${cap}. Read it yourself: nothing here moves the projection.</div>${gap}<div class="stat-list">${body}</div>${club}</div>`;
}

function rowKey(r){return anchor+'|'+r.player+'|'+r.stat+'|'+r.side}

function renderTableInto(theadId,bodyId,rows,heldCls){
 $('#'+theadId).innerHTML=COLS.map(([k,n,,t])=>{
   const on=sortCol===k, sortable=k&&k!=='#';

 });

// A stat or position pick crosses the signal-type buckets on purpose. Tackles can never be
// "Model & Market agree": no sharp book prices them (only Underdog does, and a platform pricing
// itself is not a market read), so they sit permanently in Model Only and the default chip hid
// every one of them. Asking for "Solo Tackles" or "CB" is asking for those rows, whatever bucket
// they fall in -- #crossNote says so on screen. (Josh, 2026-09-23: "I don't see the solo tackles
// or the tackles + assist in the underdog section".)
function crossingLabels(){return !!($('#stat').value||(($('#pos')||{}).value||''))}
function filtered(rows){const q=$('#q').value.toLowerCase(),st=$('#stat').value,ps=($('#pos')||{}).value||'',cf=$('#conf').value,mp=Number($('#minp').value||0)/100,mm=Number($('#minm').value||0)/100;
 const gf=gameFilter?new Set([gameFilter.away,gameFilter.home]):null;
 const cross=!!(st||ps);
 return rows.filter(r=>cross||r.label===filter)
   .filter(r=>!gf||(r.mark&&gf.has(r.mark.abbr)))
   .filter(r=>!q||(r.player+' '+(r.team||'')+' '+r.stat).toLowerCase().includes(q))
   .filter(r=>!st||r.stat===st)
   .filter(r=>!ps||(r.pos_group||r.position)===ps)
   .filter(r=>!cf||(cf==='medium'?['medium','high'].includes(r.confidence):r.confidence==='high'))
   .filter(r=>!mp||(r.prob_side||0)>=mp)
   .filter(r=>!mm||(r.market_prob||0)>=mm)}

const CONF_RANK={high:3,medium:2,low:1};
function sortVal(r,k){
 switch(k){
  case 'player': return (r.player||'').toLowerCase();
  case 'anchor_line': return r.anchor_line;
  case 'market_prob': return r.market_prob;
  case 'spread': {const s=bookSpread(r); return s?(s.hi.p-s.lo.p):null;}
  case 'prob_side': return r.prob_side;
  case 'gap': return gap(r);
  case 'bet': {const be=D.anchor_breakevens?D.anchor_breakevens[anchor]:null;
               return (be==null||r.prob_side==null)?null:r.prob_side-be;}
  case 'proj': return r.projected_line==null?null:r.projected_line-r.anchor_line;
  case 'confidence': return CONF_RANK[r.confidence]??0;
  case 'label': return -(ORDER[r.label]??9);
  case 'trend': {const tr=trendOf(r); return tr.mag==null?null:(tr.dir==='up'?tr.mag:tr.dir==='down'?-tr.mag:0);}
 }
 return null;
}
function defaultKey(r){return r.market_prob!=null&&r.market_actionable?[0,-r.market_prob,-(r.prob_side||0)]:[1,ORDER[r.label]??9,-(r.prob_side||0)]}
function cmpKey(x,y){for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]<y[i]?-1:1}return 0}
// lines/outliers.py flagged this projection as far outside what the engine usually says for the
// stat. It sinks below every other row in EVERY ordering, including an explicit column sort --
// the whole point is that it can never be the row you read first.
function qOut(r){return r.quarantined?1:0}
function sortRows(rows){
 if(sortCol){
  // Empty values always sink, whichever direction: an unpriced row is not "lowest", it is unknown.
  return rows.slice().sort((a,b)=>{
   const q=qOut(a)-qOut(b); if(q) return q;
   const x=sortVal(a,sortCol), y=sortVal(b,sortCol);
   if(x==null&&y==null) return cmpKey(defaultKey(a),defaultKey(b));
   if(x==null) return 1; if(y==null) return -1;
   if(x===y) return cmpKey(defaultKey(a),defaultKey(b));
   return (x<y?-1:1)*sortDir;
  });
 }
 return rows.slice().sort((a,b)=>{
 const q=qOut(a)-qOut(b); if(q) return q;
 return cmpKey(defaultKey(a),defaultKey(b))})}

function entries(){const E=D.entries;if(!E){$('#entriesCard').style.display='none';return}
 const node=E.anchors[anchor]||{};const f=node.funnel;const list=node.entries||[];
 const pairs=(E.corr_pairs||[]).map(p=>`<div class="row2"><span class="k">${esc(p.pair_type)}</span><span class="num">rho ${p.rho==null?'—':p.rho.toFixed(3)} <small>CI ${p.ci_lo}..${p.ci_hi} · priced ${p.priced_rho} · n=${p.n_pairs}</small></span></div>`).join('');
 $('#entriesSummary').innerHTML=`Correlated entries <span style="font-weight:400;color:var(--mut)">${list.length?`${list.length} candidate${list.length>1?'s':''}`:(node.reason?esc(node.reason):'none')}</span>`;
 let body='';
 if(f){body+=`<div class="grid">
   <div class="kpi"><div class="k">Legs on board</div><div class="v">${f.legs}<small>of ${f.board_rows} rows</small></div></div>
   <div class="kpi"><div class="k">Clear breakeven</div><div class="v">${f.legs_after_breakeven_filter}<small>independence filter (F2)</small></div></div>
   <div class="kpi"><div class="k">Seed pairs</div><div class="v">${f.seed_pairs}<small>correlated leg pairs found</small></div></div>
   <div class="kpi"><div class="k">LB tackle legs</div><div class="v">${f.lb_tackle_legs}<small>RB↔LB needs these</small></div></div>
  </div>`}
 // Entry EV is computed from prob_side. Until prob_side demonstrates skill on the graded record
 // the EV is arithmetic, not evidence, and a large number printed next to a caveat is still read
 // as a large number -- so the figures are WITHHELD rather than annotated. The legs still render,
 // because the pairing is the part that was actually measured (corr_pairs, S1 2022-2025).
 const cal=E.calibration||{}, shown=cal.skill_demonstrated===true;
 if(cal && cal.n){
  body+=`<div class="hint" style="margin:10px 0 0;border-left:3px solid var(--${shown?'up':'acc'});padding-left:9px">`
   +(shown
     ? `Model probability clears no-skill on the graded record (AUC ${cal.auc}, 95% CI ${cal.auc_lo}–${cal.auc_hi}, n=${cal.n}). EV shown.`
     : `<b>EV withheld.</b> Legs are priced from the sharp books' consensus at each platform's own line; our model only vetoes legs the market contradicts. That is deliberate: the model's own probability shows <b>no measured skill</b> on the graded record — AUC ${cal.auc} (95% CI ${cal.auc_lo}–${cal.auc_hi}, n=${cal.n}; 0.50 = coin flip), Brier ${cal.brier} vs ${cal.brier_constant_50} for always saying 50% — and priced on the model these entries claimed returns no pick'em platform would ever pay. Market-priced EV has not yet been checked against graded outcomes either, so entries stay <b>advisory</b>: the leg pairing is measured, the payoff is not. Few correlated entries survive market pricing — pick'em lines sit close to the sharp books. Interval is provisional — see nfl/calibration.py.`)
   +`</div>`}
 if(list.length){body+='<div class="stat-list" style="margin-top:10px">'+list.map(e=>`<div class="row2" style="border-bottom:1px solid var(--border-soft);padding:6px 0"><span>${e.n_picks}-pick ${esc(e.product||'')} <span class="k">${esc(e.seed_pair_type||'')}</span></span><span class="num">${shown?`EV ${e.ev==null?'—':(e.ev>=0?'+':'')+e.ev.toFixed(3)} <small>indep ${e.ev_independent==null?'—':e.ev_independent.toFixed(3)} · P(all) ${e.p_correlated}</small>`:`<small class="prop-sub">EV withheld — model probability unvalidated</small>`}</span></div>`+`<div class="prop-sub">${e.legs.map(l=>`${esc(l.player)} ${esc(l.stat)} ${esc(l.side)} ${fmt(l.line)}`).join(' · ')}</div>`).join('')+'</div>'}
 else{body+=`<div class="prop-sub" style="margin-top:10px">No entry built — ${esc(node.reason||'unknown')}. Paper only; nothing here has been graded (H4/H5 need ≥40 graded entries).</div>`}
 if(pairs)body+=`<div class="stat-list" style="margin-top:10px"><div class="prop-sub">Usable pair families (S1, 2022-2025)</div>${pairs}</div>`;
 $('#entries').innerHTML=body;
}

function envChip(team){const e=((D.dfs||{}).envs||{})[team];return e?` <span class="env ${esc(e.label)}" title="${esc(e.game)}: total ${e.total}, spread ${e.spread}, ${esc(team)} implied ${e.implied}">${esc(e.label)}</span>`:''}
function ctypeChip(t){return t?`<span class="env ctype">${esc({cash:'cash',gpp_small:'small GPP',gpp_large:'large GPP'}[t]||t)}</span>`:''}
// One lineup player: his DK line, his expected range, and the SAME player's prop lines with our
// projection and lean -- the props board and the DFS lineup read one player the same way.
function dfsPlayer(p){
 const st=(p.status&&p.status!=='None')?' · '+esc(p.status):'';
 const rg=p.range?` <span class="k" title="middle half of his DK outcomes: 25th-75th percentile, normal approximation from his sigma (sigma_approx)">${p.range.p25}–${p.range.p75}</span>`:'';
 const mk=p.market_gap==null?'':` <span class="k">· mkt ${p.market_gap>0?'+':''}${p.market_gap}</span>`;
 const props=(p.props||[]).filter(q=>q.proj!=null&&q.lean).slice(0,6).map(q=>
   `<span class="ptag" title="${esc(q.book||'')} line ${q.line}; our median ${q.proj}">${esc(q.stat)} ${q.line} → ${q.proj} <b class="${q.lean==='Over'?'up':'dn'}">${q.lean==='Over'?'O':'U'}${q.p_lean!=null?' '+Math.round(q.p_lean*100)+'%':''}</b></span>`).join('');
 return `<div class="row2 dfsrow"><span>${p.stack_locked?'🔗 ':''}${esc(p.slot)} — ${esc(p.player)} <span class="k">${esc(p.position)} ${esc(p.team||'')} vs ${esc(p.opponent||'—')}${st}</span>${envChip(p.team)}</span>`
  +`<span class="num">$${(p.salary||0).toLocaleString()} <small>${p.proj_mu==null?'—':p.proj_mu+' pts'}${rg}${mk}</small></span>`
  +(props?`<div class="dfsprops">${props}</div>`:'')+`</div>`;
}
function validNote(L){const v=L.validation;if(!v)return '';
 return v.warnings&&v.warnings.length?`<div class="prop-sub" style="color:#e0b341">⚠ ${v.warnings.map(esc).join(' · ')}</div>`:''}
function envTable(F){
 const seen={},rows=[];
 Object.values(F.envs||{}).forEach(e=>{if(seen[e.game])return;seen[e.game]=1;rows.push(e)});
 if(!rows.length) return '';
 rows.sort((a,b)=>b.total-a.total);
 const age=F.lines_age_h==null?'':` · lines ${F.lines_age_h}h old`;
 return `<div style="margin-top:10px;font-weight:600">Game environments</div><div class="prop-sub">From pre-lock lines${age}. <b>shootout</b>: total ≥ 48 and spread ≤ 3.5 · <b>lopsided</b>: spread ≥ 6.5 · <b>dead</b>: total ≤ 40 or a bottom-2 total. Defaults to be graded (spec D1/D2), not facts.</div>`
  +`<div class="stat-list" style="margin-top:4px">${rows.map(e=>{const fav=e.implied>=e.opp_implied?e.team:e.opponent, hi=Math.max(e.implied,e.opp_implied), lo=Math.min(e.implied,e.opp_implied);
    return `<div class="row2"><span>${esc(e.game)} <span class="env ${esc(e.label)}">${esc(e.label)}</span></span><span class="num">${e.total} <small>${esc(fav)} −${e.spread} · implied ${hi} / ${lo}</small></span></div>`}).join('')}</div>`;
}
function blockedList(F){const B=F.blocked||[];if(!B.length)return '';
 return `<details style="margin-top:10px"><summary style="color:var(--down)">${B.length} lineup${B.length===1?'':'s'} blocked by the pre-lock validator</summary>`
  +B.map(L=>`<div class="prop-sub">${esc(L.slot||L.role||'lineup')} ${ctypeChip(L.contest_type)}: ${(L.validation.failures||[]).map(esc).join(' · ')}</div>`).join('')+`</details>`}
function constructionCard(F){const H=F.construction||[];if(!H.length)return '';
 const col={insufficient:'var(--mut)',holding:'var(--up)',killed:'var(--down)'};
 return `<details style="margin-top:12px"><summary style="font-weight:600">Construction scorecard — spec hypotheses D1–D7</summary>`
  +`<div class="prop-sub">Each rule the builders follow is a default with a kill condition, graded from the contest standings. Insufficient until ${6} slates of that contest type are graded.</div>`
  +`<div class="stat-list" style="margin-top:4px">${H.map(h=>`<div class="row2" style="display:block"><span style="color:${col[h.status]||'var(--mut)'};font-weight:650">${esc(h.id)} ${esc(h.status)}</span> ${esc(h.hypothesis)} `
   +`<small class="prop-sub">n=${h.n_entries} entries · ${h.n_slates} slate${h.n_slates===1?'':'s'}${h.effect==null?'':` · effect ${h.effect>0?'+':''}${h.effect}`}${h.effect_note?' ('+esc(h.effect_note)+')':''}${h.why?' · '+esc(h.why):''}</small>`
   +(h.by_bucket?`<div class="prop-sub">${Object.entries(h.by_bucket).map(([k,v])=>`${k}: ${Math.round(v.cash_rate*100)}% of ${v.n}`).join(' · ')}</div>`:'')+`</div>`).join('')}</div></details>`}

 if(!F||!F.slate){card.style.display='none';return}card.style.display='';
 const sl=F.slate;

 let html=`<div class="prop-sub">draft group ${sl.draft_group_id} · ${esc(sl.slate_name||'Main')} · ${esc(sl.slate_state||'')} · kickoff ${esc((sl.min_start_time||'').slice(0,16))} · fetched ${esc((sl.fetched_at||'').slice(0,16))}</div>`

 if(F.scoring_note){html+=`<div class="prop-sub" style="margin-top:6px;font-style:italic">${esc(F.scoring_note)}</div>`}
 html+=envTable(F);
 if(F.cash&&F.cash.portfolio&&F.cash.portfolio.length){

  html+='<div style="margin-top:14px;font-weight:600">DraftKings portfolio — three lineups, three different jobs</div>';

  html+=F.cash.portfolio.map((L,i)=>{

   return `<details style="margin-top:8px" ${i===0?'open':''}><summary><span style="color:${col};font-weight:650">${title}</span> — ${L.total_proj_pts} proj · spread ±${L.lineup_sigma} · $${L.total_salary.toLocaleString()}${gtxt}</summary>`
    +`<div class="prop-sub" style="margin-top:4px">${ctypeChip(L.contest_type)} ${esc(L.role_note||'')}</div>${validNote(L)}`
    +`<div class="stat-list" style="margin-top:6px">${rows}</div></details>`;
  }).join('');
  if(F.consensus){html+=`<div class="prop-sub" style="margin-top:6px">Projection is a <b>consensus</b> of ${Object.keys(F.consensus.by_source||{}).length} sources (${Object.entries(F.consensus.by_source||{}).map(([k,v])=>esc(k)+' '+v).join(', ')}), outlier source dropped per player. Weights are <b>priors, not fitted</b> — grading below is what replaces them.</div>`}
  if(sc.sources&&Object.keys(sc.sources).length){
   html+='<div style="margin-top:10px;font-weight:600">Grading — every source against what actually happened</div>';
   html+='<div class="stat-list" style="margin-top:6px">'+Object.entries(sc.sources).map(([k,s])=>`<div class="row2"><span>${esc(k)}${sc.best_source_by_mae===k?' <span class="k">best</span>':''}</span><span class="num">MAE ${s.mae} <small>RMSE ${s.rmse} · bias ${s.bias>0?'+':''}${s.bias} · r ${s.r==null?'—':s.r} · n ${s.n}</small></span></div>`).join('');
   if(sc.consensus){html+=`<div class="row2"><span><b>consensus (the blend)</b></span><span class="num">MAE ${sc.consensus.mae} <small>RMSE ${sc.consensus.rmse} · bias ${sc.consensus.bias>0?'+':''}${sc.consensus.bias} · r ${sc.consensus.r==null?'—':sc.consensus.r} · n ${sc.consensus.n}</small></span></div>`}
   html+='</div>';
   html+=`<div class="prop-sub">${esc(sc.note||'')}</div>`;
  } else {
   html+=`<div class="prop-sub" style="margin-top:8px">Grading is armed — the portfolio and every source's opinion are written down before kickoff. Nothing has resolved yet, so there is no record to show.</div>`;

 }
 if(false&&F.cash&&F.cash.lineup){

  const mkt=p=>{

   const col=big?(g>0?'var(--bad,#c0392b)':'var(--good,#2d8a4e)'):'var(--mut)';
   const tip=g>0?'we project MORE than the prop market does':'the prop market projects more than we do';
   return ` <small style="color:${col}" title="${tip}">· mkt ${p.market_mu_partial} vs our ${p.our_mu_partial} (${g>0?'+':''}${g})${big?(g>0?' ⚠':' ▲'):''}</small>`;
  };
  const crows=L.players.map(p=>`<div class="row2"><span>${esc(p.slot)} — ${esc(p.player)} <span class="k">${esc(p.position)} ${esc(p.team||'')} vs ${esc(p.opponent||'—')}${(p.status&&p.status!=='None')?' · '+esc(p.status):''}${dfsMatchupTxt(p.matchup)}</span></span><span class="num">$${(p.salary||0).toLocaleString()} <small>${p.proj_mu==null?'—':p.proj_mu+' pts'}${p.proj_source==='dk_appg_fallback'?' (dk avg — not modelled)':''}${p.proj_sigma==null?'':' · sd '+p.proj_sigma}</small>${mkt(p)}</span></div>`).join('');
  const mc=L.market_check;
  const tight=L.lineup_sigma<=L.lineup_sigma_if_independent;
  html+=`<div style="margin-top:14px;font-weight:600">Cash lineup — 50/50 &amp; double-up</div>`
   +`<div class="prop-sub">One lineup, entered as many times as you like. In a double-up the payout is flat above the cash line, so replicating a single best lineup beats spreading across three — diversification is a tournament answer. No forced stack: correlation is priced, not required.</div>`
   +`<details style="margin-top:8px" open><summary>${L.total_proj_pts} proj pts · spread ±${L.lineup_sigma} · $${L.total_salary.toLocaleString()} (of $${(L.total_salary+L.salary_left).toLocaleString()})</summary>`
   +`<div class="stat-list" style="margin-top:6px">${crows}</div>`
   +`<div class="prop-sub" style="margin-top:8px">Lineup spread ±${L.lineup_sigma} pts vs ±${L.lineup_sigma_if_independent} if these nine were uncorrelated${tight?' — this build carries no net positive correlation':' — that gap is the cost of the overlap it carries'}. Variance priced at λ=${L.lambda}, chosen at the measured frontier knee and <i>not</i> fitted to contest results (see nfl/cash.py).</div>`
   +(mc?`<div class="prop-sub" style="margin-top:6px">Prop market cross-check: ${mc.n_covered} of ${mc.n_players} players carry a line. This lineup averages <b>${mc.lineup_mean_gap>0?'+':''}${mc.lineup_mean_gap}</b> partial DK pts above the market on those; the whole usable pool averages ${mc.pool_mean_gap>0?'+':''}${mc.pool_mean_gap}. The optimizer maximises <i>our</i> projection, so it selects for players we rate above the market — a gap much larger than the pool's is that selection bias, not a read on the player. Reported, not corrected.</div>`:'')
   +`<div class="prop-sub">${esc(F.cash.breakeven_note||'')}</div></details>`;
 } else if(F.cash&&F.cash.diagnostics&&!(F.cash.portfolio&&F.cash.portfolio.length)){
  html+=`<div class="prop-sub" style="margin-top:12px">No cash lineup built — ${esc(F.cash.diagnostics.reason||'unknown')} (pool ${F.cash.diagnostics.pool_size}; ${F.cash.diagnostics.rejected_salary_floor||0} rejected on the salary floor, ${F.cash.diagnostics.rejected_dst_conflict||0} on a DST conflict).</div>`;
 }
 if(F.lineups&&F.lineups.length){
  html+=`<div style="margin-top:14px;font-weight:600">${F.showdown?'Showdown lineups (exact solve: 1 CPT at 1.5x + 5 FLEX)':'Tournament lineups (large-field GPP) — stack the favourite; bring-back only in a shootout'}</div>`;
  if(!F.showdown){html+=`<div class="prop-sub">These chase correlation and ceiling deliberately. Not for 50/50s — see the cash lineup above.</div>`}
  html+=F.lineups.map((lu,i)=>{
   const rows=lu.players.map(dfsPlayer).join('');
   const gsk=lu.game_stack;
   const stackTag=gsk?` · 🔗 ${esc(gsk.game)} ${gsk.env?'<span class="env '+esc(gsk.env)+'">'+esc(gsk.env)+'</span>':''} ${esc(gsk.favorite_team)} implied ${gsk.implied??gsk.total}${gsk.bring_back?' + bring-back '+esc(gsk.bring_back):' · no bring-back'}`:(F.showdown?' · captain '+esc(lu.captain||''):' · no game stack this lineup');
   return `<details style="margin-top:8px" ${i===0?'open':''}><summary>Lineup ${i+1} — ${lu.total_proj_pts} proj pts · $${lu.total_salary.toLocaleString()} (of $${(lu.total_salary+lu.salary_left).toLocaleString()})${stackTag}</summary><div class="stat-list" style="margin-top:6px">${rows}</div></details>`;
  }).join('');
 } else if(F.lineup_diagnostics){
  html+=`<div class="prop-sub" style="margin-top:12px">No lineups built — pool ${F.lineup_diagnostics.pool_size}/${F.lineup_diagnostics.total_rows} usable (dropped: ${F.lineup_diagnostics.disabled} disabled, ${F.lineup_diagnostics.out} out, ${F.lineup_diagnostics.no_salary} no salary, ${F.lineup_diagnostics.no_projection} no projection) over ${F.lineup_diagnostics.restarts} restarts.</div>`;
 }
 html+=blockedList(F)+constructionCard(F);
 html+='<div style="margin-top:14px;font-weight:600">Player pool (value-ranked: proj pts per $1000)</div>';
 if(F.ruled_out){html+=`<div class="prop-sub">${F.ruled_out} player${F.ruled_out===1?'':'s'} ruled OUT or on IR are excluded — they carry a value number from games played before the injury. Questionable and doubtful are still listed.</div>`;}
 html+='<div class="stat-list" style="margin-top:6px">'+F.top.map(r=>`<div class="row2"><span>${esc(r.player)} <span class="k">${esc(r.position)} ${esc(r.team||'')} vs ${esc(r.opponent||'—')}${(r.status&&r.status!=='None')?' · '+esc(r.status):''}${dfsMatchupTxt(r.matchup)}</span></span><span class="num">$${(r.salary||0).toLocaleString()} <small>${r.proj_mu==null?(r.appg==null?'no proj':r.appg+' FPPG'):r.proj_mu+' pts'+(r.proj_source==='dk_appg_fallback'?' (dk avg)':'')}${r.value==null?'':' · '+r.value+' val'}</small></span></div>`).join('')+'</div>';
 $('#dfs').innerHTML=html;
}

const PLAT={prizepicks:'PrizePicks',draftkings:'DraftKings',underdog:'Underdog'};
const ANCH_FOR={prizepicks:'prizepicks-api',underdog:'underdog-api',draftkings:'draftkings-(pick-3)'};
let bestStrongOnly=false, bestStat='', bestOpen=null;
function boardMatch(r){
 // The model/board row for this prop -- the best platform's own anchor first, then any other anchor.
 // Projection, model P, matchup, news and the price ladder live there; a best-line row only knows lines.
 const order=[ANCH_FOR[r.best_platform],...Object.keys(D.anchors)].filter((a,i,arr)=>a&&D.anchors[a]&&arr.indexOf(a)===i);
 const find=sameSide=>{for(const a of order){const hit=(D.anchors[a].rows||[]).find(b=>b.player_key===r.player_key&&b.stat===r.stat&&(!sameSide||b.side===r.side));if(hit)return {row:hit,anchor:a,sameSide:hit.side===r.side}}return null};
 return find(true)||find(false)}
function bestKey(r){return r.player_key+'|'+r.stat+'|'+r.side}
function bestLine(){const B=D.best_line;const card=$('#bestCard');if(!B){card.style.display='none';return}card.style.display='';
 const rows=B.rows.filter(r=>(!bestStrongOnly||r.strong)&&(!bestStat||r.stat===bestStat));
 const nStrong=B.rows.filter(r=>r.strong).length, thin=B.rows.some(r=>r.n_platforms<3);
 const stats=[...new Set(B.rows.map(r=>r.stat))].sort();
 const src=Object.entries(B.sources).map(([k,v])=>`<span class="tag" title="${esc(v)}">${esc(k)}: ${esc(/^20/.test(v)?CT(v.slice(0,20)):v)}</span>`).join(' ');
 const hitTxt=r=>r.hit==null?'—':`${r.hit_basis==='dgf'&&!r.dgf_exact?'≥':''}${(r.hit*100).toFixed(1)}%${r.hit_basis==='price'?' <small title="implied from a real per-pick price (Underdog)">px</small>':' <small title="DGF fair % from the middling tab">dgf</small>'}`;
 $('#bestSummary').innerHTML=`Best line <span style="font-weight:400;color:var(--mut)">${B.n_total} sides · ${nStrong} flagged ${Math.round(B.strong_prob*100)}%+ · lowest Over / highest Under across ${B.playable.map(p=>PLAT[p]||p).join(', ')} · click a row for projection, matchup, news and prices</span>`;
 const COLN=12;
 const body=rows.map(r=>{
   const m=boardMatch(r), b=m&&m.row;
   const proj=b?b.projected_line:null, d=proj==null?null:proj-r.best_line;
   // coloured toward the side: a projection above the line helps an Over, below it helps an Under
   const dCls=d==null||Math.abs(d)<0.15?'flat':((r.side==='Over'?d>0:d<0)?'pos':'neg');
   const mp=b&&b.prob_side!=null?(m.sameSide?b.prob_side:1-b.prob_side):null;
   const k=bestKey(r), open=bestOpen===k;
   const note=!m?'':`<div class="hint" style="padding:10px 18px 0">${m.sameSide
     ?`Board context from the ${esc(D.anchors[m.anchor].label)} anchor at line ${fmt(b.anchor_line)}.`

const ODDS_COLS=[['pinnacle','pinnacle','Pinnacle'],['actionnetwork','consensus','Consensus'],['actionnetwork','open','Open'],['actionnetwork','draftkings','DraftKings'],['actionnetwork','fanduel','FanDuel'],['actionnetwork','betmgm','BetMGM'],['actionnetwork','caesars','Caesars'],['actionnetwork','bet365','bet365'],['actionnetwork','betrivers','BetRivers'],['actionnetwork','bovada','Bovada']];
const ODDS_ROWS=[['game','spread','Spread'],['game','total','Total'],['game','moneyline','Moneyline'],['game','team_total_home','Home team total'],['game','team_total_away','Away team total'],['1h','spread','1H spread'],['1h','total','1H total'],['1h','moneyline','1H moneyline'],['1h','team_total_home','1H home team total'],['1h','team_total_away','1H away team total'],['1q','spread','1Q spread'],['1q','total','1Q total'],['1q','moneyline','1Q moneyline']];
function sgn(x){return x==null?'—':(x>0?'+':'')+fmt(x)}
function am(x){return x==null?'':(x>0?'+':'')+x}
function oddsFind(g,src,book,per,m){return (g&&g.latest||[]).find(r=>r.source===src&&r.book===book&&r.period===per&&r.market===m)}
// A game in the light payload carries `best` -- the sharpest capture of the full-game spread, total
// and moneyline -- and not the 55 KB ladder behind it. That is everything the rail card reads, so
// the rail paints before any per-game file has landed.
function oddsBest(g,per,m){
 const hit=oddsFind(g,'pinnacle','pinnacle',per,m)||oddsFind(g,'actionnetwork','consensus',per,m);
 if(hit) return hit;
 if(per!=='game'||!g||!g.best) return undefined;
 const b=g.best[m];
 return b?Object.assign({period:'game',market:m},b):undefined}
// The per-game ladders, for the whole-slate "Game lines" card. Fetched once, in the background,
// after first paint: the card is the only reader and it is below the board.
let ODDS_BACKFILLED=false;
async function backfillOdds(){
 if(ODDS_BACKFILLED||!DBASE) return;
 ODDS_BACKFILLED=true;
 const gs=((D.game_odds||{}).games)||[];
 await Promise.all(gs.map(g=>loadGame(g.away,g.home)));
 // render(), not gameOdds(): a per-game file also carries that game's GRAHAM write-up, and an open
 // prop drawer shows it. Redrawing only the odds card left the drawer reading "Loading the
 // write-up..." for as long as nothing else happened to re-render.
 render();
}
function oddsCell(r,g){if(!r)return '<span class="prop-sub">—</span>';
 if(r.market==='spread')return `${esc(g.home)} ${sgn(r.line)} <small>${am(r.price_home)}</small>`;
 if(r.market==='moneyline')return `${esc(g.home)} ${am(r.price_home)} <small>${esc(g.away)} ${am(r.price_away)}</small>`;
 return `${fmt(r.line)} <small>o${am(r.price_over)} u${am(r.price_under)}</small>`}
// ONE implied-total source (Rev B item 6a, 2026-09-26): the payload's game_env -- nfl/game_env.implied_totals(),
// the same Pinnacle capture and the same arithmetic the DFS pool and GRAHAM use. The books' own team-total
// rows still appear in the odds table below, labelled as the books' numbers; they are not this figure.
function impliedTotals(g){const E=D.game_env||(D.dfs&&D.dfs.game_env)||{};const e=E[g.away+'@'+g.home];
 if(!e||!e.implied)return null;
 return {home:e.implied[g.home],away:e.implied[g.away],basis:'game_env · '+(e.source||'')+(e.captured_at?' '+CT(e.captured_at):'')}}
// #gameStrip was the header's one-line odds sentence; the games rail replaced it. Guarded rather
// than deleted so the detailed Game lines card below still renders either way.
// A slim game carries `best` and no `latest`: this card is the one reader that needs the ladders, so
// it asks for them once in the background and re-renders itself when they arrive, rather than
// reporting "no odds captured" for data that simply has not been fetched.
function gameOdds(){const O=D.game_odds;const card=$('#oddsCard');const strip=$('#gameStrip');
 const games=(O&&O.games)||[];
 if(!games.length){card.style.display='none';if(strip)strip.textContent='';return}
 const full=g=>((GAMEDETAIL.get(g.away+'@'+g.home)||{}).odds)||g;
 if(DBASE&&!ODDS_BACKFILLED&&!games.some(g=>(full(g).latest||[]).length)){backfillOdds();}
 if(!games.some(g=>(full(g).latest||[]).length||g.best)){card.style.display='none';if(strip)strip.textContent='';return}
 card.style.display='';
 if(strip)strip.innerHTML=O.games.map(g=>{const sp=oddsBest(g,'game','spread'),to=oddsBest(g,'game','total'),it=impliedTotals(g);
   return `<b>${esc(g.away)} @ ${esc(g.home)}</b>${sp?` · ${esc(g.home)} ${sgn(sp.line)}`:''}${to?` · O/U ${fmt(to.line)}`:''}${it?` · implied ${esc(g.home)} ${fmt(it.home)} / ${esc(g.away)} ${fmt(it.away)}`:''}`}).join(' &nbsp;|&nbsp; ');
 $('#oddsSummary').innerHTML=`Game lines <span style="font-weight:400;color:var(--mut)">${O.games.length} game${O.games.length>1?'s':''} · full game, 1st half, 1st quarter · Pinnacle and Action Network books · sharp movement since first capture</span>`;
 $('#odds').innerHTML=O.games.map(g0=>{
   const g=full(g0);
   const it=impliedTotals(g0);
   const body=ODDS_ROWS.filter(([per,m])=>ODDS_COLS.some(([s,b])=>oddsFind(g,s,b,per,m))).map(([per,m,label])=>{
     const f=(g.pinnacle_first||[]).find(r=>r.period===per&&r.market===m),cur=oddsFind(g,'pinnacle','pinnacle',per,m);
     const mv=f&&cur&&f.line!=null&&cur.line!==f.line?`<div class="prop-sub">Pinnacle ${sgn(f.line)} → ${sgn(cur.line)} since ${esc(CT(f.captured_at))}</div>`:'';
     // Action Network's book set varies between requests (2026-09-14: 8 books on one call, 3 on the next), so a
     // book's latest quote can come from an older capture than the game's newest -- say so instead of passing it off as live.
     // Stale = missing from its OWN feed's newest capture, or over 3h old. Comparing against the game's newest capture
     // across feeds marked every Pinnacle quote stale whenever Action Network pulled a few minutes later.
     const newestBy={};g.latest.forEach(r=>{if(!newestBy[r.source]||r.captured_at>newestBy[r.source])newestBy[r.source]=r.captured_at});
     const stale=r=>r&&(r.captured_at<newestBy[r.source]||Date.now()-Date.parse(r.captured_at)>3*3600e3);
     const cell=r=>`${oddsCell(r,g)}${stale(r)?`<div class="prop-sub" title="not in this feed's latest capture, or over 3h old">as of ${esc(CT(r.captured_at))}</div>`:''}`;
     return `<tr class="row" style="cursor:default"><td>${label}${mv}</td>${ODDS_COLS.map(([s,b])=>`<td class="r num">${cell(oddsFind(g,s,b,per,m))}</td>`).join('')}</tr>`}).join('');
   return `<div style="margin:6px 0 8px"><b>${esc(g.away)} @ ${esc(g.home)}</b> <span class="prop-sub">kickoff ${esc((g.kickoff||'').slice(0,16).replace('T',' '))}Z · ${g.captures} capture${g.captures===1?'':'s'}${it?` · implied ${esc(g.home)} ${fmt(it.home)} / ${esc(g.away)} ${fmt(it.away)} (${esc(it.basis)})`:''}</span></div>
   <div class="tablescroll"><table style="min-width:780px"><thead><tr><th>Market</th>${ODDS_COLS.map(c=>`<th class="r">${c[2]}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${ODDS_COLS.length+1}" class="empty">No game odds captured yet.</td></tr>`}</tbody></table></div>`}).join('');
}

// ── the builder (heuristic, same shape as nfl/cash.py: randomized greedy fill + local search)
// The rule set and its constants come from dfs_pool.json, exported from nfl/dfs_rules.py -- ONE rule
// source. tests/test_dfs_js_parity.py runs this file under node and feeds every lineup back through
// Python's dfs_rules.violations(). Not an exact optimum, and it says so (is_optimal false).
function gkey(p){return [String(p.team||'').toUpperCase(),String(p.opp||'').toUpperCase()].sort().join('@')}

function violations(ps,r,envByTeam,complete){

 const cheap=ps.filter(p=>p.pos!=='DST'&&(p.salary||0)<r.min_player_salary);
 if(cheap.length)out.push('under $'+r.min_player_salary+': '+cheap.map(p=>p.name).join(', '));

 for(const g in byG){const grp=byG[g];const lab=(envByTeam[String(grp[0].team||'').toUpperCase()]||{}).label;
  let cap=lab==='shootout'?r.max_per_game_shootout:r.max_per_game;
  if(lab==='dead')cap=Math.min(cap,r.max_from_dead);
  if(grp.length>cap)out.push(grp.length+' players from '+g+' ('+(lab||'unlabelled')+': max '+cap+')')}
 ps.filter(p=>p.pos==='DST').forEach(d=>{
  if(ps.some(p=>p!==d&&String(p.team||'').toUpperCase()===String(d.opp||'').toUpperCase()))
   out.push('DST '+d.name+' faces a rostered player')});

  if(qb&&!ps.some(p=>(p.pos==='WR'||p.pos==='TE')&&p.team===qb.team))out.push('QB has no pass-catcher from his own team')}

}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);

  if(exc.has(p.player_key))return false;

 // sum(mu - T*salary/1000) at a full cap IS maximising the lineup multiplier, which is the thing
 // Josh is actually buying: "a $4,000 player scoring 12 is a 3x".

 function seatFeatured(mine){const seat={},used=new Set();

   const pick=cands[Math.floor(rng()*Math.min(cands.length,Math.max(6,Math.ceil(cands.length*0.35))))]||cands[0];

   let c=fill(mine);if(!c){reasons['no feasible fill under the cap']=(reasons['no feasible fill under the cap']||0)+1;continue}
   const lock=new Set();for(let i=0;i<slots.length;i++)if(mineKeys.has(c[i].player_key))lock.add(i);
   c=improve(c,lock);
   const ps=Object.keys(c).map(k=>c[k]);
   const v=violations(ps,r,envByTeam,true);
   if(v.length){v.forEach(x=>reasons[x]=(reasons[x]||0)+1);continue}
   const keys=new Set(ps.map(p=>p.player_key));
   let dup=false;
   for(const prev of out){let same=0;prev.keys.forEach(k=>{if(keys.has(k))same++});
    if(slots.length-same<(opts.minUnique||2)){dup=true;break}}
   if(dup){reasons['too similar to an earlier lineup']=(reasons['too similar to an earlier lineup']||0)+1;continue}
   const sc=lineupScore(ps,ct);
   if(sc>bestScore){bestScore=sc;bestC=Object.assign({},c);best=record(c,builtOn[n])}}
  }
  expOff=false;
  if(!best)break;
  if(bestC){                                   // pairwise polish, kept only if it stays legal and unique
   const lock=new Set();for(let i=0;i<slots.length;i++)if(mineKeys.has(bestC[i].player_key))lock.add(i);
   const pc=polish(Object.assign({},bestC),lock);
   const ps=slots.map((sl,i)=>pc[i]);
   if(!violations(ps,r,envByTeam,true).length){
    const keys=new Set(ps.map(p=>p.player_key));
    let dup=false;
    for(const prev of out){let same=0;prev.keys.forEach(k=>{if(keys.has(k))same++});
     if(slots.length-same<(opts.minUnique||2)){dup=true;break}}
    if(!dup&&lineupScore(ps,ct)>best.score)best=record(pc,builtOn[n])}}
  best.keys.forEach(k=>{expUsed[k]=(expUsed[k]||0)+1});
  out.push(best)}
 if(expRelaxed)reasons['exposure cap relaxed for '+expRelaxed+' variation(s) -- the pool is too thin to spread further']=expRelaxed;
 if(out.length&&featured.length){                      // every featured player must land somewhere
  const seen=new Set();out.forEach(L=>L.keys.forEach(k=>seen.add(k)));
  const miss=featured.filter(p=>!seen.has(p.player_key));
  if(miss.length)return{lineups:out,reason:'featured but not rostered: '+miss.map(p=>p.name).join(', ')}}
 const top=Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];
 const expTop=Object.entries(expUsed).sort((a,b)=>b[1]-a[1])[0];
 return{lineups:out,stacked:out.filter(L=>L.stack).length,
  exposure:{cap:expCap===Infinity?null:expCap,n:opts.n,relaxed:expRelaxed,
   top:expTop?{key:expTop[0],lineups:expTop[1]}:null},
  reason:out.length?(out.length<opts.n&&top?('only '+out.length+' of '+opts.n+': '+top[0]):null):(top?('nothing satisfied: '+top[0]):'no lineup found')};
}

function generate(){
 const n=Math.max(1,Math.min(12,parseInt($('#nVar').value||'3',10)));
 $('#nVar').value=n;$('#genState').textContent='working…';$('#buildMsg').hidden=true;
 setTimeout(()=>{
  const t0=performance.now();
  const envs={};(POOLD.games||[]).forEach(g=>{for(const t in (g.implied||{}))envs[t]={label:g.label}});
  const groups=[...FEATSTACK].map(k=>{const s=(POOLD.stacks||[]).find(x=>x.game===k);
   return s?{key:s.game,keys:[s.qb,s.catcher,s.bring_back].filter(Boolean).map(x=>x.player_key)}:null}).filter(Boolean);
  const res=buildLineups({players:POOLD.players,rules:rules(),ctype:CTYPE,
   slots:(POOLD.slate&&POOLD.slate.roster_slots)||[],cap:(POOLD.slate&&POOLD.slate.salary_cap)||50000,
   envs:envs,featured:FEAT,excluded:EXC,n:n,seed:Date.now()&0xffff,minUnique:2,
   stacks:POOLD.stacks||[],groups:groups,stackMode:STACKMODE(),multTarget:target()});
  BUILDS=res.lineups;BUILDCT=CTYPE;
  const ms=Math.round(performance.now()-t0);
  const st=BUILDS.filter(L=>L.stack).length;
  BUILDEXP=res.exposure||null;
  const ex=(BUILDEXP&&BUILDEXP.cap)?' · max '+BUILDEXP.cap+'/'+n+' per player':'';
  $('#genState').textContent=BUILDS.length+' of '+n+' built · '+st+' stacked'+ex+' · '+ms+'ms';
  if(res.reason){$('#buildMsg').hidden=false;
   $('#buildMsg').innerHTML='Could not build '+(BUILDS.length?'all ':'any ')+'lineups — '+esc(res.reason)
    +'. Relax a rule, un-feature a player, or widen the pool.'}
  drawLineups();
 },20)}
function drawLineups(){
 if(!BUILDS.length){$('#lineups').innerHTML='<div class="card"><div class="body"><div class="empty">No lineups yet.</div></div></div>';return}
 const cashNote=CTYPE==='cash'&&BUILDS.length>1
  ?'<div class="hint">In a double-up the payout is flat above the cash line, so the standard play is ONE lineup entered N times. These variations are built because you asked for them.</div>':'';
 const cap=(POOLD.slate&&POOLD.slate.salary_cap)||50000;
 $('#lineups').innerHTML='<div class="card"><div class="body">'+cashNote+'<div class="lugrid">'+BUILDS.map((L,i)=>{
  const rows=L.players.map(p=>{
   const f=FEAT.has(p.player_key)?' class="featrow"':'';
   const d=`data-key="${esc(p.player_key)}" data-name="${esc(p.name)}"`;
   return `<tr${f}><td class="pos" ${d} title="${esc(p.team||'')}${p.env?' · '+esc(p.env.label):''}">${esc(p.slot)}</td>
    <td ${d} title="${esc(p.name)} — ${esc(p.team||'')} vs ${esc(p.opp||'')}">${esc(p.name)}</td>
    <td class="sal" ${d}>$${((p.salary||0)/1000).toFixed(1)}k</td>
    <td class="pts" ${d}>${muOf(p).toFixed(1)}</td></tr>`}).join('');
  const lo=(L.mu-0.674*L.sigma).toFixed(1),hi=(L.mu+0.674*L.sigma).toFixed(1);
  return `<div class="lu"><div class="luhead"><span>Lineup ${i+1}</span><span class="num">${L.mu} pts</span></div>
   <div class="lusub">$${L.salary.toLocaleString()} used · ${lo}–${hi} likely · <span class="${multCls(L.mult!=null?L.mult:L.mu/50)}" title="${rules().qb_stack_required?`${(L.mult_ceiling||0).toFixed(2)}x at this lineup's ceiling — a GPP's target multiplier is a tail number, not a mean`:'projected points per $1,000 of the cap'}">${(L.mult!=null?L.mult:L.mu/50).toFixed(2)}x</span> vs ${target()}x needed</div>
   <table><tbody>${rows}</tbody></table><div class="lucomp">${lineupWhy(L)}</div></div>`}).join('')+'</div>'
  +'<div class="prop-sub" style="margin-top:8px">Heuristic build (greedy + local search), not a solved optimum — the same posture as the house lineups. Ranges are <span title="mu +/- 0.674 sigma, independence approximation">sigma_approx</span>. A featured player appears in at least one variation, not all of them.'
  +(BUILDS.some(L=>L.players.filter(p=>p.pos==='TE').length>1)?teNote():'')
  +((BUILDEXP&&BUILDEXP.relaxed)?' <b>Exposure cap relaxed on '+BUILDEXP.relaxed+' variation'+(BUILDEXP.relaxed>1?'s':'')+'</b> — the pool is too thin to spread further.':'')
  +'</div></div></div>'}
// Why a second tight end keeps appearing, where it appears (nfl/dfs_rules.CHEAP_TE_EVIDENCE).
function teNote(){const e=RC.cheap_te_evidence;if(!e)return '';
 const s1=e.scoreless_share&&e.scoreless_share['1'],s2=e.scoreless_share&&e.scoreless_share['2'];
 if(!s1||!s2)return '';
 return ' <b>Two tight ends is a pricing structure, not a preference:</b> in the $'
  +(e.tier[0]/1000).toFixed(1)+'–$'+(e.tier[1]/1000).toFixed(1)+'k tier a back or receiver scored NOTHING in '
  +Math.round(100*Math.min(s1.RB,s2.RB))+'–'+Math.round(100*Math.max(s1.RB,s2.RB))+'% of weeks 1–2, against '
  +Math.round(100*Math.min(s1.TE,s2.TE))+'–'+Math.round(100*Math.max(s1.TE,s2.TE))+'% for tight ends, because a cheap tight end is usually a starter. '
  +'The field shows no significant edge either way ('+Math.round(100*e.field_2te_rate)+'% vs '+Math.round(100*e.field_1te_rate)+'% cashed), so it is managed as exposure, not banned.';}

// Best price per point at each end of each position group (nfl/dfs_pool.position_picks).
// What Weeks 1-2 actually taught, contest-aware, next to what THIS slate looks like. The numbers are
// from 1,321 graded Week 2 cash entries (docs/DFS_OPTIMIZER_SPEC_V1_2026-09-25.md); they are one
// slate, and nfl/dfs_scorecard.py grades them as D1-D7 rather than treating them as settled.
function drawStacks(){
 const st=POOLD.stacks||[];
 if(!st.length){$('#stacks').innerHTML='';return}
 const shield=t=>idShield(D.marks&&D.marks[t],true);
 const leg=(x,role)=>{if(!x)return '';
  const vol=[x.attempts!=null?x.attempts+' att':'',x.targets!=null?x.targets+' tgt':'',
             x.receptions!=null?x.receptions+' rec':'',x.pass_td_line!=null?x.pass_td_line+' pass TD':''].filter(Boolean).join(' · ');
  const td=x.p_td!=null?`<span class="tdo ${x.p_td>=0.45?'hi':(x.p_td>=0.30?'mid':'')}" title="anytime TD">${Math.round(x.p_td*100)}%</span>`:'';
  return `<div class="leg">${shield(x.team||'')}<span class="sk" style="flex:1"><span class="kn" data-key="${esc(x.player_key)}" data-name="${esc(x.name)}">${esc(x.name)}</span>
   <small>${esc(role)} · $${((x.salary||0)/1000).toFixed(1)}k${vol?' · '+esc(vol):''}</small></span>${td}
   <span class="${multCls(x.mult)}" style="font-weight:700">${x.mult!=null?x.mult.toFixed(1)+'x':''}</span></div>`};
 $('#stacks').innerHTML='<div class="card"><details open><summary>Key stacks</summary><div class="body">'
  +'<div class="hint">The favourite QB and his top projected catcher, ranked by the favourite team implied total. The bring-back is in only for a shootout. The same touchdown pays the passer 4 and the catcher 6 — that shared scoring event is what a stack is buying, so the volume props behind it are shown with it.</div>'
  +st.map((k,i)=>{
   const legs=leg(k.qb,'QB')+leg(k.catcher,'catcher')+(k.bring_back?leg(k.bring_back,'bring-back'):'');
   const corr=[k.exp_td!=null?`<span>combined TD projection <b>${k.exp_td}</b></span>`:'',
     `<span>combined score <b>${k.proj}</b> on <b>$${(k.salary||0).toLocaleString()}</b></span>`,
     `<span>stack multiplier <b class="${multCls(k.salary?k.proj/(k.salary/1000):null)}">${k.salary?(k.proj/(k.salary/1000)).toFixed(1)+'x':'—'}</b></span>`].filter(Boolean).join('');
   return `<div class="stk"><div class="sh">${shield(k.favorite)}<b>${esc(k.game)}</b>
     <span class="env ${esc(k.env||'')}">${esc(k.env||'')}</span>
     <span class="k">${esc(k.favorite)} implied ${k.implied??'—'} · O/U ${k.total??'—'}</span>
     <span style="flex:1"></span>
     <button type="button" class="pd-btn${FEATSTACK.has(k.game)?' on':''}" data-stack="${i}" title="Build one variation around this whole stack — the legs go into the SAME lineup, not one each">${FEATSTACK.has(k.game)?'✓ Stack featured':'Feature stack'}</button></div>
    <div class="legs">${legs}</div><div class="corr">${corr}</div>
    <div class="prop-sub" style="margin-top:3px">${esc(k.why)}</div></div>`}).join('')
  +'</div></details></div>';
 $('#stacks').querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>openPoolDrawer(el.dataset.key,el.dataset.name)));
 $('#stacks').querySelectorAll('[data-stack]').forEach(b=>b.addEventListener('click',()=>{
  const k=st[+b.dataset.stack],legs=[k.qb,k.catcher,k.bring_back].filter(Boolean);
  if(FEATSTACK.has(k.game)){FEATSTACK.delete(k.game);legs.forEach(x=>FEAT.delete(x.player_key))}
  else{FEATSTACK.add(k.game);legs.forEach(x=>{FEAT.add(x.player_key);EXC.delete(x.player_key)})}
  savePrefs();drawPool();drawStacks();$('#genState').textContent='stack '+(FEATSTACK.has(k.game)?'featured':'cleared')+' — regenerate';}));
}

function drawPicks(){
 const P=POOLD.picks||{};const order=['QB','RB','WR','TE','DST'].filter(k=>P[k]);
 if(!order.length){$('#valuePicks').innerHTML='';return}
 $('#valuePicks').innerHTML=`<div class="prop-sub" style="margin-top:8px">Best multiplier per position —
  projected points per $1,000 of salary, on the market's own fantasy-point line where the books post one.
  <b>PREM</b> is the best at or above $${PREM.toLocaleString()}; <b>VALUE</b> the best under
  $${VALP.toLocaleString()} — the cap is $${AVGSLOT.toLocaleString()} a slot, so only a player below that
  average frees money to buy a premium one. Both are held to at least their position's median projection.</div><div class="vpicks">`
  +order.map(pos=>{const k=P[pos];
   const line=(kind,cls,v)=>v?`<div class="vp-row" data-key="${esc(v.player_key)}" data-name="${esc(v.name)}" title="${v.points.toFixed(1)} pts on $${(v.salary||0).toLocaleString()} [${esc(v.basis||'')}]">
     <span class="who"><span class="vtag ${cls}">${kind}</span> ${esc(v.name)}</span>
     <span class="${multCls(v.mult)}">${v.mult.toFixed(1)}x</span></div>`:'';
   const note=k.split_basis==='position_median_salary'?` <span class="k" title="no ${esc(pos)} reaches $${PREM.toLocaleString()}, so both ends split at this position's own median salary">split $${(k.split||0).toLocaleString()}</span>`:'';
   return `<div class="vpick"><div class="vp-pos">${esc(pos)}${note}</div>${line('PREM','prem',k.premium)}${line('VALUE','slp',k.sleeper)}</div>`}).join('')+'</div>';
 $('#valuePicks').querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>openPoolDrawer(el.dataset.key,el.dataset.name)));
}

// Why this lineup looks the way it does: the construction facts the rules are written about.
function lineupWhy(L){
 const ps=L.players,bits=[];
 const last=n=>String(n||'').split(' ').slice(-1)[0];
 bits.push(ps.filter(p=>p.pos!=='DST'&&(p.salary||0)>=PREM).length+' premium');
 const qb=ps.find(p=>p.pos==='QB');
 if(qb){
  const mates=ps.filter(p=>(p.pos==='WR'||p.pos==='TE')&&p.team===qb.team);
  const bb=ps.filter(p=>p.pos!=='DST'&&String(p.team||'')===String(qb.opp||''));
  if(mates.length)bits.push('stack '+last(qb.name)+' + '+mates.map(m=>last(m.name)).join(' + ')
   +(L.stack&&L.stack.key?' ('+L.stack.key+')':''));
  else bits.push(rules().qb_stack_required?'NO QB STACK':'no stack — cash rule');
  if(bb.length)bits.push('bring-back '+bb.map(m=>last(m.name)).join(' + '));
 }
 const byG={};ps.forEach(p=>{const g=p.game||p.team;(byG[g]=byG[g]||[]).push(p)});
 const big=Object.entries(byG).sort((a,b)=>b[1].length-a[1].length)[0];
 if(big&&big[1].length>1){const lab=(big[1][0].env||{}).label;bits.push(big[1].length+' from '+big[0]+(lab?' ('+lab+')':''))}
 const dead=ps.filter(p=>(p.env||{}).label==='dead').length;if(dead)bits.push(dead+' from a dead game');
 if(L.mult!=null){const T=L.mult_target||3;
  bits.push(rules().qb_stack_required
   ?(L.mult.toFixed(2)+'x projected, '+(L.mult_ceiling||L.mult).toFixed(2)+'x ceiling vs the '+T+'x bar')
   :(L.mult.toFixed(2)+'x vs the '+T+'x bar'+(L.surplus!=null?' ('+(L.surplus>=0?'+':'')+L.surplus.toFixed(1)+' pts)':'')))}
 return esc(bits.join(' · '))}

function bestBoardRow(k){let best=null,score=-1;
 for(const a of Object.values(D.anchors||{})){for(const r of a.rows||[]){if(r.player_key!==k)continue;
  const sc=(r.matchup?4:0)+(r.projected_line!=null?2:0)+(r.dfs?1:0)+((r.news&&r.news.length)?1:0)+((r.claims&&r.claims.length)?1:0);
  if(sc>score){score=sc;best=r}}}
 return best}
function openPoolDrawer(k,name){const r=bestBoardRow(k);const t=$('#pdTitle');t.textContent=name||k;
 t.dataset.name=name||'';t.dataset.key=k;
 const who=(POOLD.players||[]).find(p=>p.player_key===k)||{};
 $('#poolDrawerBody').innerHTML=r?rowDetail(r):`<div class="detail"><div class="dcol"><div class="empty">No prop rows for ${esc(name||k)} on this week's boards — DFS data only.</div></div><div class="dcol">${grahamBlock({player_key:k,team:who.team})}</div></div>`;
 drawerBtns(k);$('#poolDrawer').hidden=false}
function closePoolDrawer(){$('#poolDrawer').hidden=true}
function highlightPool(k){const sel=`#poolList .prow[data-key="${(window.CSS&&CSS.escape)?CSS.escape(k):k}"]`;
 let el=document.querySelector(sel);
 if(!el){ENVF=null;const pq=$('#pq');if(pq)pq.value='';
  const who=(POOLD.players||[]).find(p=>p.player_key===k);
  POSF=who?(FLEXPOS.includes(who.pos)?'FLEX':who.pos):'FLEX';
  $('#posTabs').querySelectorAll('.ptab').forEach(t=>t.classList.toggle('on',t.dataset.pos===POSF));
  drawEnvs();drawPool();el=document.querySelector(sel)}
 if(el){el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-optlink]');if(!a)return;e.preventDefault();
 closePoolDrawer();location.hash='#dfs';setTab();setTimeout(()=>highlightPool(a.dataset.optlink),80)});
setTab();
</script></body></html>
